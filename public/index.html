  const typeLabel=r.report_type==='weekly'?'周报':'月报';
  const typeClass=r.report_type==='weekly'?'report-type-weekly':'report-type-monthly';
  const field=(icon,label,val,extraClass='')=>val?`<div class="report-field"><div class="report-field-label">${icon} ${label}</div><div class="report-field-value ${extraClass}">${esc(val)}</div></div>`:'';
  return `<div class="card report-card" style="margin-bottom:4px"><div class="card-body">
    <div class="report-meta">
      <span class="report-period">${esc(r.report_period)||'未设周期'}</span>
      <span class="report-type-badge ${typeClass}">${typeLabel}</span>
      <span style="margin-left:auto;font-size:11px;color:var(--text-muted)">${r.created_at||''}</span>
      <button class="btn btn-sm btn-secondary" onclick="openReportForm(${r.id},${r.account_id})">编辑</button>
      <button class="btn btn-sm btn-danger" onclick="if(confirm('确定删除这条报告？'))deleteReport(${r.id})">删除</button>
    </div>
    ${field('🔴','本期最重要的一件事',r.most_important,'highlight-box')}
    ${field('📝','重点工作',r.key_work)}
    ${field('❓','需要品鉴者决策',r.need_decision,'highlight-box insight')}
    ${field('🤝','跨线协同需求',r.cross_team_needs)}
    ${field('🚧','瓶颈/阻塞',r.bottlenecks)}
    ${field('➡️','下期最重要的一件事',r.next_important)}
  </div></div>`;
}
function renderArContactsTab(){
  const tc=document.getElementById('ar-tab-content');
  const ha=document.getElementById('header-actions');
  ha.innerHTML=`<button class="btn btn-secondary" onclick="navigate('octo-summary')">← 返回</button><button class="btn btn-primary" onclick="openContactForm(null,${_accountReportData.id})">+ 新增联系人</button>`;
  const contacts=_accountContacts||[];
  const groups=[
    {key:'决策层',icon:'👑',cls:'cg-decision'},
    {key:'管理层',icon:'💼',cls:'cg-management'},
    {key:'执行层',cls:'cg-execution',icon:'⚙️'}
  ];
  let html=`<div style="margin-bottom:16px"><button class="btn btn-primary" onclick="openContactForm(null,${_accountReportData.id})">+ 新增联系人</button></div>`;
  if(!contacts.length){
    html+=`<div class="card"><div class="empty-state"><p>暂无联系人</p></div></div>`;
  }else{
    groups.forEach(g=>{
      const list=contacts.filter(c=>c.role_level===g.key);
      if(!list.length) return;
      html+=`<div class="contact-group">
        <div class="contact-group-header ${g.cls}">${g.icon} ${g.key} (${list.length}人)</div>
        <div class="contact-group-body">
          ${list.map(c=>`<div class="contact-person-card">
            <div class="cpc-name">${esc(c.name)}${c.is_champion?'<span class="cpc-champion">⭐</span>':''}</div>
            <div class="cpc-title">${esc(c.title)||''}${c.department?' · '+esc(c.department):''}</div>
            <div class="cpc-contact">${c.phone?esc(c.phone):''}${c.email?' · '+esc(c.email):''}</div>
            ${c.notes?`<div class="cpc-notes">${esc(c.notes)}</div>`:''}
            <div class="cpc-actions" style="margin-left:auto"><button class="btn btn-sm btn-secondary" onclick="openContactForm(${c.id},${c.account_id})">编辑</button> <button class="btn btn-sm btn-danger" onclick="if(confirm('确定删除？'))deleteContact(${c.id})">删除</button></div>
          </div>`).join('')}
        </div>
      </div>`;
    });
    // Ungrouped (no role_level set)
    const ungrouped=contacts.filter(c=>!c.role_level);
    if(ungrouped.length){
      html+=`<div class="contact-group">
        <div class="contact-group-header" style="background:rgba(100,116,139,.1);border-left:3px solid var(--text-muted);color:var(--text-muted)">📋 未分级 (${ungrouped.length}人)</div>
        <div class="contact-group-body">
          ${ungrouped.map(c=>`<div class="contact-person-card">
            <div class="cpc-name">${esc(c.name)}${c.is_champion?'<span class="cpc-champion">⭐</span>':''}</div>
            <div class="cpc-title">${esc(c.title)||''}${c.department?' · '+esc(c.department):''}</div>
            <div class="cpc-contact">${c.phone?esc(c.phone):''}${c.email?' · '+esc(c.email):''}</div>
            ${c.notes?`<div class="cpc-notes">${esc(c.notes)}</div>`:''}
            <div class="cpc-actions" style="margin-left:auto"><button class="btn btn-sm btn-secondary" onclick="openContactForm(${c.id},${c.account_id})">编辑</button> <button class="btn btn-sm btn-danger" onclick="if(confirm('确定删除？'))deleteContact(${c.id})">删除</button></div>
          </div>`).join('')}
        </div>
      </div>`;
    }
  }
  tc.innerHTML=html;
}

// Report CRUD
async function openReportForm(reportId,accountId){
  let r={};if(reportId){r=_accountReports.find(x=>x.id===reportId)||{}}
  openModal(`
    <div class="modal-header"><h3>${reportId?'编辑报告':'新增报告'}</h3><button onclick="closeModal()" style="font-size:20px">✕</button></div>
    <div class="modal-body"><form id="report-form" onsubmit="saveReport(event,${reportId||'null'},${accountId})">
      <div class="form-row">
        <div class="form-group"><label>报告类型</label><select name="report_type"><option value="weekly" ${r.report_type!=='monthly'?'selected':''}>周报</option><option value="monthly" ${r.report_type==='monthly'?'selected':''}>月报</option></select></div>
        <div class="form-group"><label>周期</label><input name="report_period" value="${esc(r.report_period||'')}" placeholder="如 2026-W39 或 2026-09"></div>
      </div>
      <div class="form-group"><label>🔴 本${r.report_type==='monthly'?'月':'周'}最重要的一件事</label><textarea name="most_important" rows="2" placeholder="一件事">${esc(r.most_important||'')}</textarea></div>
      <div class="form-group"><label>📝 重点工作</label><textarea name="key_work" rows="4">${esc(r.key_work||'')}</textarea></div>
      <div class="form-group"><label>❓ 需要品鉴者决策</label><textarea name="need_decision" rows="2">${esc(r.need_decision||'')}</textarea></div>
      <div class="form-group"><label>🤝 跨线协同需求</label><textarea name="cross_team_needs" rows="2">${esc(r.cross_team_needs||'')}</textarea></div>
      <div class="form-group"><label>🚧 瓶颈/阻塞</label><textarea name="bottlenecks" rows="2">${esc(r.bottlenecks||'')}</textarea></div>
      <div class="form-group"><label>➡️ 下${r.report_type==='monthly'?'月':'周'}最重要</label><textarea name="next_important" rows="2">${esc(r.next_important||'')}</textarea></div>
      <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:16px">
        <button type="button" class="btn btn-secondary" onclick="closeModal()">取消</button>
        <button type="submit" class="btn btn-primary">💾 保存</button>
      </div>
    </form></div>`);
}
async function saveReport(ev,reportId,accountId){
  ev.preventDefault();const body=Object.fromEntries(new FormData(document.getElementById('report-form')));
  try{
    if(reportId){await api('/api/accounts/reports/'+reportId,{method:'PUT',body});toast('报告更新成功')}
    else{await api(`/api/accounts/${accountId}/reports`,{method:'POST',body});toast('报告创建成功')}
    closeModal();renderAccountReport(accountId);
  }catch(e){toast(e.message,'error')}
}
async function deleteReport(reportId){
  try{await api('/api/accounts/reports/'+reportId,{method:'DELETE'});toast('删除成功');renderAccountReport(_accountReportData.id)}catch(e){toast(e.message,'error')}
}

// Contact CRUD
async function openContactForm(contactId,accountId){
  let c={};if(contactId){c=_accountContacts.find(x=>x.id===contactId)||{}}
  openModal(`
    <div class="modal-header"><h3>${contactId?'编辑联系人':'新增联系人'}</h3><button onclick="closeModal()" style="font-size:20px">✕</button></div>
    <div class="modal-body"><form id="contact-form" onsubmit="saveContact(event,${contactId||'null'},${accountId})">
      <div class="form-row">
        <div class="form-group"><label>姓名 *</label><input name="name" required value="${esc(c.name||'')}"></div>
        <div class="form-group"><label>职位</label><input name="title" value="${esc(c.title||'')}"></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>部门</label><input name="department" value="${esc(c.department||'')}"></div>
        <div class="form-group"><label>角色级别</label><select name="role_level"><option value="">请选择</option>${['决策层','管理层','执行层'].map(l=>`<option value="${l}" ${c.role_level===l?'selected':''}>${l}</option>`).join('')}</select></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>电话</label><input name="phone" value="${esc(c.phone||'')}"></div>
        <div class="form-group"><label>邮箱</label><input name="email" value="${esc(c.email||'')}"></div>
      </div>
      <div class="form-group"><label style="display:flex;align-items:center;gap:8px"><input type="checkbox" name="is_champion" value="1" ${c.is_champion?'checked':''} style="width:auto"> ⭐ Champion</label></div>
      <div class="form-group"><label>备注</label><textarea name="notes" rows="2">${esc(c.notes||'')}</textarea></div>
      <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:16px">
        <button type="button" class="btn btn-secondary" onclick="closeModal()">取消</button>
        <button type="submit" class="btn btn-primary">💾 保存</button>
      </div>
    </form></div>`);
}
async function saveContact(ev,contactId,accountId){
  ev.preventDefault();const fd=new FormData(document.getElementById('contact-form'));const body=Object.fromEntries(fd);
  body.is_champion=fd.get('is_champion')?1:0;
  try{
    if(contactId){await api('/api/accounts/contacts/'+contactId,{method:'PUT',body});toast('联系人更新成功')}
    else{await api(`/api/accounts/${accountId}/contacts`,{method:'POST',body});toast('联系人创建成功')}
    closeModal();renderAccountReport(accountId);
  }catch(e){toast(e.message,'error')}
}
async function deleteContact(contactId){
  try{await api('/api/accounts/contacts/'+contactId,{method:'DELETE'});toast('删除成功');renderAccountReport(_accountReportData.id)}catch(e){toast(e.message,'error')}
}

// ===== HELPERS =====
function leadStatusName(s){return{new:'新进线',contacted:'已联系',qualified:'已转出',opportunity:'商机',closed_won:'成单',closed_lost:'无效/丢单'}[s]||s}
function leadStatusTag(s){const m={new:'gray',contacted:'blue',qualified:'purple',opportunity:'yellow',closed_won:'green',closed_lost:'red'};return `<span class="tag tag-${m[s]||'gray'}">${leadStatusName(s)}</span>`}
function stageName(s){return leadStatusName(s)}
function stageTag(s){return leadStatusTag(s)}
function eventStatusTag(s){const m={'筹备中':'blue','进行中':'yellow','已结束':'green','已取消':'gray'};return `<span class="tag tag-${m[s]||'gray'}">${esc(s)}</span>`}
function statusTag(s){return eventStatusTag(s)}
function sourceTag(s){if(!s)return'—';return `<span class="tag tag-blue">${esc(s)}</span>`}
function followUpTag(s){if(!s)return'—';const m={'待跟进':'yellow','跟进中':'blue','已完成':'green','已放弃':'gray'};return `<span class="tag tag-${m[s]||'gray'}">${esc(s)}</span>`}
function customerStageTag(s){if(!s)return'';return `<span class="stage-tag stage-${s}">${esc(s)}</span>`}
function fmtNum(n){if(!n||n===0)return'0';if(n>=10000)return(n/10000).toFixed(1)+'万';if(n>=1000)return n.toLocaleString();return n}
function tryParse(s){try{return JSON.parse(s)||[]}catch{return[]}}
function openModal(h){document.getElementById('modal').innerHTML=h;document.getElementById('modal-overlay').classList.add('active')}
function closeModal(){document.getElementById('modal-overlay').classList.remove('active')}
async function deleteItem(t,id,name){if(!confirm(`确定删除「${name}」？`))return;try{await api(`/api/${t}/${id}`,{method:'DELETE'});toast('删除成功');navigate(t==='leads'?'funnel':t==='accounts'?'octo-summary':t)}catch(e){toast(e.message,'error')}}

// ===== INIT =====
navigate('dashboard');
</script>
