<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MKT-CRM · 市场部 AI-Native 工作台</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --primary:#0f172a;--primary-light:#1e293b;
  --accent:#3b82f6;--accent-light:#60a5fa;--accent-dark:#1d4ed8;
  --accent-glow:rgba(59,130,246,.15);
  --bg:#0f172a;--bg-card:#1e293b;--bg-card-hover:#263548;--bg-surface:#162032;
  --border:#334155;--border-light:#475569;
  --text:#f1f5f9;--text-secondary:#94a3b8;--text-muted:#64748b;--text-bright:#fff;
  --success:#10b981;--success-bg:rgba(16,185,129,.12);
  --warning:#f59e0b;--warning-bg:rgba(245,158,11,.12);
  --danger:#ef4444;--danger-bg:rgba(239,68,68,.12);
  --info:#8b5cf6;--info-bg:rgba(139,92,246,.12);
  --pink:#ec4899;--cyan:#06b6d4;--orange:#f97316;
  --shadow:0 1px 3px rgba(0,0,0,.3);
  --shadow-md:0 4px 12px rgba(0,0,0,.3);
  --shadow-lg:0 10px 25px rgba(0,0,0,.4);
  --shadow-glow:0 0 20px rgba(59,130,246,.15);
  --radius:8px;--radius-lg:12px;--radius-xl:16px;
  --sidebar-w:240px;--header-h:56px;
  --tier-s:#ef4444;--tier-a:#f97316;--tier-b:#3b82f6;--tier-c:#64748b;
  --gradient-hero:linear-gradient(135deg,#0f172a 0%,#1e1b4b 50%,#0c1426 100%);
  --gradient-accent:linear-gradient(135deg,#3b82f6,#8b5cf6);
  --gradient-green:linear-gradient(135deg,#10b981,#06b6d4);
  --gradient-pink:linear-gradient(135deg,#ec4899,#f97316);
  --gradient-orange:linear-gradient(135deg,#f97316,#eab308);
}
html{font-size:14px;-webkit-font-smoothing:antialiased}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);line-height:1.6}
a{color:var(--accent-light);text-decoration:none}
button{cursor:pointer;font-family:inherit;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:inherit;border:1px solid var(--border);border-radius:var(--radius);padding:8px 12px;outline:none;transition:border-color .2s;background:var(--bg-surface);color:var(--text)}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
textarea{resize:vertical;min-height:80px}
select option{background:var(--bg-card);color:var(--text)}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}

/* Layout */
.layout{display:flex;min-height:100vh}
.sidebar{width:var(--sidebar-w);background:linear-gradient(180deg,#0c1220 0%,#0a0f1a 100%);color:#fff;position:fixed;top:0;left:0;bottom:0;z-index:100;display:flex;flex-direction:column;overflow-y:auto;border-right:1px solid rgba(255,255,255,.06)}
.sidebar-logo{padding:20px;border-bottom:1px solid rgba(255,255,255,.06)}
.sidebar-logo h1{font-size:15px;font-weight:700;color:#fff;display:flex;align-items:center;gap:8px}
.sidebar-logo small{display:block;font-size:11px;color:var(--text-muted);font-weight:400;margin-top:4px;letter-spacing:.5px}
.sidebar-nav{flex:1;padding:12px 0}
.nav-section{padding:0 10px;margin-bottom:4px}
.nav-section-title{font-size:10px;text-transform:uppercase;color:var(--text-muted);padding:12px 12px 4px;letter-spacing:1px;font-weight:600}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:var(--radius);color:var(--text-secondary);font-size:13px;cursor:pointer;transition:all .15s;margin:1px 0;position:relative}
.nav-item:hover{background:rgba(255,255,255,.05);color:var(--text)}
.nav-item.active{background:var(--accent-glow);color:var(--accent-light);font-weight:600}
.nav-item.active::before{content:'';position:absolute;left:0;top:50%;transform:translateY(-50%);width:3px;height:20px;background:var(--accent);border-radius:0 2px 2px 0}
.nav-item .icon{font-size:16px;width:20px;text-align:center}
.nav-item .badge{margin-left:auto;background:rgba(59,130,246,.2);color:var(--accent-light);padding:1px 7px;border-radius:10px;font-size:11px;font-weight:600}

.main{margin-left:var(--sidebar-w);flex:1;min-width:0}
.header{height:var(--header-h);background:rgba(15,23,42,.8);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 24px;position:sticky;top:0;z-index:50}
.header h2{font-size:15px;font-weight:600;color:var(--text)}
.header-actions{display:flex;gap:8px;align-items:center}
.content{padding:24px}

/* Cards */
.card{background:var(--bg-card);border-radius:var(--radius-lg);border:1px solid var(--border);box-shadow:var(--shadow);transition:border-color .2s}
.card:hover{border-color:var(--border-light)}
.card-header{padding:14px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.card-header h3{font-size:13px;font-weight:600;color:var(--text)}
.card-body{padding:20px}

/* Buttons */
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:var(--radius);font-size:13px;font-weight:500;transition:all .15s;border:1px solid transparent}
.btn-primary{background:var(--gradient-accent);color:#fff;border:none;box-shadow:0 2px 8px rgba(59,130,246,.3)}
.btn-primary:hover{box-shadow:0 4px 12px rgba(59,130,246,.4);transform:translateY(-1px)}
.btn-secondary{background:var(--bg-surface);color:var(--text);border:1px solid var(--border)}
.btn-secondary:hover{background:var(--bg-card-hover);border-color:var(--border-light)}
.btn-danger{background:var(--danger-bg);color:var(--danger);border:1px solid rgba(239,68,68,.2)}
.btn-danger:hover{background:rgba(239,68,68,.2)}
.btn-sm{padding:5px 10px;font-size:12px}

/* Hero Stats (Dashboard) */
.hero{background:var(--gradient-hero);border-radius:var(--radius-xl);padding:32px;margin-bottom:24px;position:relative;overflow:hidden;border:1px solid rgba(59,130,246,.1)}
.hero::before{content:'';position:absolute;top:-50%;right:-20%;width:400px;height:400px;background:radial-gradient(circle,rgba(59,130,246,.08) 0%,transparent 70%);pointer-events:none}
.hero::after{content:'';position:absolute;bottom:-30%;left:10%;width:300px;height:300px;background:radial-gradient(circle,rgba(139,92,246,.06) 0%,transparent 70%);pointer-events:none}
.hero-title{font-size:20px;font-weight:700;color:var(--text-bright);margin-bottom:4px;position:relative}
.hero-sub{font-size:12px;color:var(--text-muted);margin-bottom:24px;position:relative}
.hero-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;position:relative}
.hero-stat{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.06);border-radius:var(--radius-lg);padding:20px;text-align:center;cursor:pointer;transition:all .2s}
.hero-stat:hover{background:rgba(255,255,255,.07);transform:translateY(-2px);box-shadow:var(--shadow-glow)}
.hero-stat .icon{font-size:28px;margin-bottom:8px;display:block}
.hero-stat .value{font-size:36px;font-weight:800;background:var(--gradient-accent);-webkit-background-clip:text;-webkit-text-fill-color:transparent;line-height:1.1}
.hero-stat .value.green{background:var(--gradient-green);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.hero-stat .value.pink{background:var(--gradient-pink);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.hero-stat .value.orange{background:var(--gradient-orange);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.hero-stat .label{font-size:12px;color:var(--text-secondary);margin-top:4px}
.hero-stat .sub{font-size:11px;color:var(--text-muted);margin-top:6px}

/* Stats Grid */
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:20px}
.stat-card{background:var(--bg-card);border-radius:var(--radius-lg);padding:16px 20px;border:1px solid var(--border);cursor:pointer;transition:all .2s;position:relative;overflow:hidden}
.stat-card:hover{border-color:var(--accent);box-shadow:var(--shadow-glow);transform:translateY(-1px)}
.stat-card .accent-bar{position:absolute;top:0;left:0;right:0;height:2px}
.stat-card .stat-value{font-size:24px;font-weight:800;margin:4px 0 2px}
.stat-card .stat-label{font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.5px}
.stat-card .stat-sub{font-size:11px;color:var(--text-secondary);margin-top:6px}

/* Tables */
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{text-align:left;padding:10px 12px;font-size:11px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid var(--border)}
td{padding:10px 12px;font-size:13px;border-bottom:1px solid rgba(51,65,85,.5);vertical-align:top}
tr:hover td{background:rgba(255,255,255,.02)}
.clickable-row{cursor:pointer}
.clickable-row:hover td{background:var(--accent-glow)}

/* Tags */
.tag{display:inline-flex;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:500}
.tag-blue{background:rgba(59,130,246,.15);color:#60a5fa}
.tag-green{background:rgba(16,185,129,.15);color:#34d399}
.tag-yellow{background:rgba(245,158,11,.15);color:#fbbf24}
.tag-red{background:rgba(239,68,68,.15);color:#f87171}
.tag-gray{background:rgba(100,116,139,.15);color:#94a3b8}
.tag-purple{background:rgba(139,92,246,.15);color:#a78bfa}
.tag-pink{background:rgba(236,72,153,.15);color:#f472b6}
.tag-cyan{background:rgba(6,182,212,.15);color:#22d3ee}
.tier-badge{display:inline-flex;width:26px;height:26px;border-radius:6px;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff}
.tier-S{background:var(--tier-s);box-shadow:0 0 8px rgba(239,68,68,.3)}
.tier-A{background:var(--tier-a);box-shadow:0 0 8px rgba(249,115,22,.3)}
.tier-B{background:var(--tier-b);box-shadow:0 0 8px rgba(59,130,246,.3)}
.tier-C{background:var(--tier-c)}

/* Forms */
.form-group{margin-bottom:16px}
.form-group label{display:block;font-size:12px;font-weight:600;color:var(--text-secondary);margin-bottom:4px}
.form-group input,.form-group select,.form-group textarea{width:100%;display:block}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.form-row-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px}

/* Funnel */
.funnel{display:flex;flex-direction:column;gap:6px;max-width:600px}
.funnel-stage{display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:var(--radius);background:var(--bg-card);border:1px solid var(--border);transition:all .15s}
.funnel-stage:hover{border-color:var(--accent);box-shadow:var(--shadow-glow)}
.funnel-bar{height:28px;border-radius:4px;min-width:4px;transition:width .8s cubic-bezier(.4,0,.2,1)}
.funnel-label{font-size:13px;font-weight:500;min-width:80px}
.funnel-count{font-size:20px;font-weight:800;min-width:50px;text-align:right}
.funnel-pct{font-size:11px;color:var(--text-muted);min-width:40px}

/* Detail */
.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.detail-field{margin-bottom:12px}
.detail-field .label{font-size:11px;color:var(--text-muted);margin-bottom:2px;text-transform:uppercase;letter-spacing:.5px}
.detail-field .value{font-size:14px;color:var(--text)}
.detail-field .value:empty::after{content:'—';color:var(--text-muted)}

/* Metric Ring */
.metric-ring{display:flex;align-items:center;gap:16px;padding:16px;background:var(--bg-surface);border-radius:var(--radius-lg);border:1px solid var(--border)}
.metric-ring .ring{width:64px;height:64px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:800;border:3px solid var(--accent);position:relative}
.metric-ring .ring-label{font-size:12px;color:var(--text-secondary)}
.metric-ring .ring-sub{font-size:11px;color:var(--text-muted)}

/* Data Bar (horizontal bar chart in HTML) */
.data-bars{display:flex;flex-direction:column;gap:6px}
.data-bar-row{display:flex;align-items:center;gap:8px;font-size:12px}
.data-bar-label{min-width:100px;color:var(--text-secondary);text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.data-bar{flex:1;height:20px;background:var(--bg-surface);border-radius:3px;overflow:hidden}
.data-bar-fill{height:100%;border-radius:3px;transition:width .6s ease;min-width:2px}
.data-bar-value{min-width:50px;font-weight:600;font-size:11px;color:var(--text-muted)}

/* Tabs */
.tabs{display:flex;gap:0;border-bottom:1px solid var(--border);margin-bottom:20px;overflow-x:auto}
.tab{padding:10px 20px;font-size:13px;font-weight:500;color:var(--text-muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;transition:all .15s;white-space:nowrap}
.tab:hover{color:var(--text)}
.tab.active{color:var(--accent-light);border-bottom-color:var(--accent);font-weight:600}

/* Search */
.search-bar{display:flex;gap:8px;margin-bottom:16px;align-items:center}
.search-bar input{flex:1;max-width:320px}
.search-bar select{min-width:120px}

/* Upload */
.upload-area{border:2px dashed var(--border);border-radius:var(--radius-xl);padding:40px;text-align:center;cursor:pointer;transition:all .2s}
.upload-area:hover,.upload-area.dragover{border-color:var(--accent);background:var(--accent-glow)}
.upload-area .icon{font-size:36px;margin-bottom:8px}
.upload-area p{color:var(--text-secondary);font-size:13px}

/* Empty state */
.empty-state{text-align:center;padding:48px 24px;color:var(--text-muted)}
.empty-state .icon{font-size:48px;margin-bottom:12px}
.empty-state p{font-size:14px;margin-bottom:16px}

/* Opportunity table */
.opp-level{display:inline-flex;padding:3px 10px;border-radius:4px;font-size:11px;font-weight:600;letter-spacing:.3px}
.opp-商机{background:rgba(239,68,68,.15);color:#f87171}
.opp-高潜{background:rgba(249,115,22,.15);color:#fb923c}
.opp-战略{background:rgba(139,92,246,.15);color:#a78bfa}
.opp-关注{background:rgba(59,130,246,.15);color:#60a5fa}
.opp-待分配{background:rgba(100,116,139,.15);color:#94a3b8}

/* Signal chips */
.signal-chip{display:inline-flex;align-items:center;gap:4px;padding:6px 12px;background:var(--bg-surface);border:1px solid var(--border);border-radius:20px;font-size:12px;margin:3px}
.signal-chip .count{background:var(--accent);color:#fff;border-radius:10px;padding:0 6px;font-size:10px;font-weight:700}

/* Chart container */
.chart-container{position:relative;height:260px}

/* Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(4px);z-index:200;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .2s}
.modal-overlay.active{opacity:1;pointer-events:all}
.modal{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-xl);width:90%;max-width:640px;max-height:85vh;overflow-y:auto;box-shadow:var(--shadow-lg)}
.modal-header{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.modal-body{padding:20px}
.modal-footer{padding:12px 20px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px}

/* Toast */
.toast-container{position:fixed;top:16px;right:16px;z-index:300;display:flex;flex-direction:column;gap:8px}
.toast{padding:12px 16px;border-radius:var(--radius);background:var(--bg-card);border:1px solid var(--border);box-shadow:var(--shadow-lg);font-size:13px;animation:slideIn .3s ease}
.toast-success{border-left:3px solid var(--success)}
.toast-error{border-left:3px solid var(--danger)}
@keyframes slideIn{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}

/* Highlight box */
.highlight-box{background:var(--bg-surface);border:1px solid var(--border);border-left:3px solid var(--accent);border-radius:var(--radius);padding:16px;margin-bottom:12px;font-size:13px;line-height:1.7}
.highlight-box.insight{border-left-color:var(--warning)}
.highlight-box.danger{border-left-color:var(--danger)}
.highlight-box.success{border-left-color:var(--success)}

/* Responsive */
@media(max-width:768px){
  .sidebar{display:none}.main{margin-left:0}
  .hero-stats{grid-template-columns:1fr 1fr}
  .form-row,.form-row-3,.detail-grid{grid-template-columns:1fr}
}

/* Animate counter */
@keyframes countUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.animate-in{animation:countUp .4s ease both}

/* Octo 大客户模块 */
.timeline{display:flex;flex-direction:column;gap:16px}
.report-card{position:relative}
.report-card .report-meta{display:flex;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.report-card .report-period{font-size:15px;font-weight:700;color:var(--accent-light)}
.report-card .report-type-badge{padding:2px 8px;border-radius:4px;font-size:11px;font-weight:600}
.report-type-weekly{background:rgba(59,130,246,.15);color:#60a5fa}
.report-type-monthly{background:rgba(139,92,246,.15);color:#a78bfa}
.report-card .report-field{margin-bottom:10px}
.report-card .report-field-label{font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px;display:flex;align-items:center;gap:4px}
.report-card .report-field-value{font-size:13px;line-height:1.7;white-space:pre-wrap}
.kpi-row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}
.decision-card{background:var(--bg-card);border:1px solid var(--border);border-left:3px solid var(--warning);border-radius:var(--radius);padding:14px 18px;margin-bottom:8px;cursor:pointer;transition:all .15s}
.decision-card:hover{border-color:var(--warning);background:var(--bg-card-hover)}
.decision-card .dc-company{font-size:12px;color:var(--accent-light);font-weight:600;margin-bottom:4px}
.decision-card .dc-period{font-size:11px;color:var(--text-muted);margin-left:8px}
.decision-card .dc-content{font-size:13px;line-height:1.6}
.timeline-item{display:flex;gap:14px;position:relative;padding-bottom:14px;border-bottom:1px solid rgba(51,65,85,.3)}
.timeline-item:last-child{border-bottom:none;padding-bottom:0}
.timeline-dot{width:10px;height:10px;border-radius:50%;background:var(--accent);margin-top:6px;flex-shrink:0;box-shadow:0 0 0 3px var(--accent-glow)}
.timeline-content{flex:1;min-width:0}
.timeline-item .ti-header{display:flex;gap:8px;align-items:center;margin-bottom:4px;flex-wrap:wrap}
.timeline-item .ti-company{font-weight:600;font-size:13px;cursor:pointer;color:var(--accent-light)}
.timeline-item .ti-company:hover{text-decoration:underline}
.timeline-item .ti-period{font-size:11px;color:var(--text-muted);background:var(--bg-surface);padding:1px 6px;border-radius:3px}
.timeline-item .ti-most{font-size:12px;color:var(--text-secondary);line-height:1.5;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.champion-tag{background:linear-gradient(135deg,#f59e0b,#ec4899);color:#fff;padding:2px 8px;border-radius:4px;font-size:10px;font-weight:700;letter-spacing:.3px}
.account-header{display:flex;align-items:center;gap:16px;margin-bottom:20px;padding:20px 24px;background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-lg)}
.account-header .ah-name{font-size:20px;font-weight:700}
.account-header .ah-meta{display:flex;gap:12px;margin-top:6px;flex-wrap:wrap;font-size:12px;color:var(--text-secondary)}
.sub-tabs{display:flex;gap:0;border-bottom:1px solid var(--border);margin-bottom:20px}
</style>
</head>
<body>
<div class="layout">
  <aside class="sidebar">
    <div class="sidebar-logo">
      <h1>🏢 MKT-CRM</h1>
      <small>市场部 AI-Native 工作台</small>
    </div>
    <nav class="sidebar-nav">
      <div class="nav-section">
        <div class="nav-section-title">概览</div>
        <div class="nav-item active" data-page="dashboard" onclick="navigate('dashboard')">
          <span class="icon">📊</span>Dashboard
        </div>
      </div>
      <div class="nav-section">
        <div class="nav-section-title">业务板块</div>
        <div class="nav-item" data-page="events" onclick="navigate('events')">
          <span class="icon">🎪</span>Event 活动<span class="badge" id="badge-events">0</span>
        </div>
        <div class="nav-item" data-page="speeches" onclick="navigate('speeches')">
          <span class="icon">🎤</span>辉哥演讲<span class="badge" id="badge-speeches">0</span>
        </div>
        <div class="nav-item" data-page="octo-summary" onclick="navigate('octo-summary')">
          <span class="icon">🐙</span>Octo 大客户<span class="badge" id="badge-decisions" style="display:none">0</span>
        </div>

        </div>

    </div>
  </aside>

  <div class="main">

      <h2 id="page-title">Dashboard</h2>

<div class="modal-overlay" id="modal-overlay" onclick="if(event.target===this)closeModal()">

</div>
<div class="toast-container" id="toast-container"></div>

<script>
const API='';
async function api(path,opts={}){const url=API+path;const config={headers:{'Content-Type':'application/json'},...opts};if(config.body&&typeof config.body==='object'&&!(config.body instanceof FormData))config.body=JSON.stringify(config.body);if(config.body instanceof FormData)delete config.headers['Content-Type'];const res=await fetch(url,config);const data=await res.json();if(!res.ok)throw new Error(data.error||'请求失败');return data}
function toast(msg,type='success'){const el=document.createElement('div');el.className=`toast toast-${type}`;el.textContent=msg;document.getElementById('toast-container').appendChild(el);setTimeout(()=>el.remove(),3000)}
function esc(s){if(!s)return '';const d=document.createElement('div');d.textContent=String(s);return d.innerHTML}
function err(e){return `<div class="empty-state"><div class="icon">⚠️</div><p>${esc(e.message||e)}</p></div>`}

let currentPage='dashboard',stats={},charts={};

function navigate(page,params={}){
  currentPage=page;
  document.querySelectorAll('.nav-item').forEach(el=>el.classList.toggle('active',el.dataset.page===page));
  const content=document.getElementById('content');
  const ha=document.getElementById('header-actions');
  ha.innerHTML='';destroyCharts();
  const titles={dashboard:'Dashboard',events:'🎪 Event 活动工作台','event-detail':'🎪 活动详情','event-form':'🎪 新建/编辑活动',speeches:'🎤 辉哥演讲获客','speech-detail':'🎤 演讲详情','speech-form':'🎤 新建/编辑演讲','octo-summary':'🐙 Octo 大客户','account-report':'🐙 客户全景报告',accounts:'🏢 客户列表','account-detail':'🐙 客户 360° 视图','account-form':'🐙 新建/编辑客户',funnel:'🔄 SDR 漏斗',import:'📥 数据导入'};
  document.getElementById('page-title').textContent=titles[page]||page;
  const r={dashboard:renderDashboard,events:renderEvents,'event-detail':()=>renderEventDetail(params.id),'event-form':()=>renderEventForm(params.id),speeches:renderSpeeches,'speech-detail':()=>renderSpeechDetail(params.id),'speech-form':()=>renderSpeechForm(params.id),'octo-summary':()=>renderOctoSummary(params.tab),'account-report':()=>renderAccountReport(params.id),accounts:renderAccounts,'account-detail':()=>renderAccountDetail(params.id),'account-form':()=>renderAccountForm(params.id),funnel:renderFunnel,import:renderImport};
  (r[page]||renderDashboard)();
}
function destroyCharts(){Object.values(charts).forEach(c=>c.destroy());charts={}}

// ===== DASHBOARD =====
async function renderDashboard(){
  const content=document.getElementById('content');
  content.innerHTML='<div style="text-align:center;padding:60px;color:var(--text-muted)">⏳ 加载数据...</div>';
  try{stats=await api('/api/stats')}catch(e){content.innerHTML=err(e);return}
  updateBadges();

  const preparing=(stats.events.byStatus.find(s=>s.status==='筹备中')||{c:0}).c;
  const ongoing=(stats.events.byStatus.find(s=>s.status==='进行中')||{c:0}).c;
  const finished=(stats.events.byStatus.find(s=>s.status==='已结束')||{c:0}).c;

  content.innerHTML=`
    <div class="hero">
      <div class="hero-title">MKT-CRM · 市场部数据指挥中心</div>
      <div class="hero-sub">明略科技 · 品牌与市场部 AI-Native 工作台 · 实时数据概览</div>
      <div class="hero-stats">
        <div class="hero-stat animate-in" onclick="navigate('events')" style="animation-delay:.1s">
          <span class="icon">🎪</span>
          <div class="value">${stats.events.total}</div>
          <div class="label">Event 活动</div>
          <div class="sub">${preparing} 筹备中 · ${ongoing} 进行中 · ${finished} 已结束</div>
        </div>
        <div class="hero-stat animate-in" onclick="navigate('speeches')" style="animation-delay:.2s">
          <span class="icon">🎤</span>
          <div class="value pink">${stats.speeches.total}</div>
          <div class="label">辉哥演讲</div>
          <div class="sub">累计触达 ${fmtNum(stats.speeches.totalAudience)} 人</div>
        </div>
        <div class="hero-stat animate-in" onclick="navigate('octo-summary')" style="animation-delay:.3s">
          <span class="icon">🐙</span>
          <div class="value green">${stats.accounts.total}</div>
          <div class="label">Octo 大客户</div>
          <div class="sub">${stats.accounts.byTier.map(t=>t.tier+': '+t.c).join(' · ')||'等待导入'}</div>
        </div>
        <div class="hero-stat animate-in" onclick="navigate('funnel')" style="animation-delay:.4s">
          <span class="icon">🔄</span>
          <div class="value orange">${stats.leads.total}</div>
          <div class="label">SDR 线索</div>
          <div class="sub">${(stats.leads.byStatus||[]).map(s=>stageName(s.status)+' '+s.c).join(' · ')||'等待导入'}</div>
        </div>
      </div>
    </div>

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:20px">
      <div class="card">
        <div class="card-header"><h3>📊 SDR 线索漏斗</h3></div>
        <div class="card-body">${(stats.leads.byStatus||[]).length?'<div class="chart-container"><canvas id="chart-funnel"></canvas></div>':'<div class="empty-state" style="padding:24px"><p>导入线索数据后自动生成漏斗</p></div>'}</div>
      </div>
      <div class="card">
        <div class="card-header"><h3>🏢 客户等级分布</h3></div>
        <div class="card-body">${stats.accounts.byTier.length?'<div class="chart-container"><canvas id="chart-tiers"></canvas></div>':'<div class="empty-state" style="padding:24px"><p>导入客户数据后自动生成分布图</p></div>'}</div>
      </div>
    </div>

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px">
      <div class="card">
        <div class="card-header"><h3>🎪 最近活动</h3><button class="btn btn-sm btn-primary" onclick="navigate('event-form')">+ 新建</button></div>
        <div class="card-body" style="padding:0">
          ${stats.recentEvents.length?`<table>
            <tr><th>活动名称</th><th>日期</th><th>报名</th><th>到场</th><th>留资</th><th>状态</th></tr>
            ${stats.recentEvents.map(e=>`<tr class="clickable-row" onclick="navigate('event-detail',{id:${e.id}})">
              <td><strong>${esc(e.name)}</strong></td><td>${e.date||'—'}</td>
              <td>${e.registration_count||'—'}</td><td>${e.attendance_count||'—'}</td>
              <td style="font-weight:700;color:var(--accent-light)">${e.leads_count||0}</td>
              <td>${statusTag(e.status)}</td>
            </tr>`).join('')}
          </table>`:'<div class="empty-state" style="padding:32px"><div class="icon">🎪</div><p>暂无活动</p><button class="btn btn-primary" onclick="navigate(\'event-form\')">+ 创建第一个活动</button></div>'}
        </div>
      </div>
      <div class="card">
        <div class="card-header"><h3>🔥 最新线索</h3></div>
        <div class="card-body" style="padding:0">
          ${stats.recentLeads.length?`<table>
            <tr><th>姓名</th><th>公司</th><th>来源</th><th>阶段</th></tr>
            ${stats.recentLeads.map(l=>`<tr>
              <td>${esc(l.contact_name)||'—'}</td><td>${esc(l.company_name)||'—'}</td>
              <td>${sourceTag(l.source_channel)}</td><td>${leadStatusTag(l.status)}</td>
            </tr>`).join('')}
          </table>`:'<div class="empty-state" style="padding:32px"><div class="icon">🔄</div><p>暂无线索</p><button class="btn btn-primary" onclick="navigate(\'import\')">📥 导入数据</button></div>'}
        </div>
      </div>
    </div>
  `;

  if(stats.leads.byStatus&&stats.leads.byStatus.length){
    const so=['new','contacted','qualified','opportunity','closed_won','closed_lost'];
    const sd=so.map(s=>(stats.leads.byStatus.find(x=>x.status===s)||{c:0}).c);
    charts.funnel=new Chart(document.getElementById('chart-funnel'),{type:'bar',data:{labels:so.map(leadStatusName),datasets:[{label:'线索数',data:sd,backgroundColor:['#475569','#3b82f6','#8b5cf6','#f59e0b','#10b981','#ef4444'],borderRadius:6,borderSkipped:false}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{y:{beginAtZero:true,ticks:{precision:0,color:'#64748b'},grid:{color:'rgba(51,65,85,.3)'}},x:{ticks:{color:'#64748b'},grid:{display:false}}}}});
  }
  if(stats.accounts.byTier.length){
    charts.tiers=new Chart(document.getElementById('chart-tiers'),{type:'doughnut',data:{labels:stats.accounts.byTier.map(t=>t.tier+' 级'),datasets:[{data:stats.accounts.byTier.map(t=>t.c),backgroundColor:stats.accounts.byTier.map(t=>({'S':'#ef4444','A':'#f97316','B':'#3b82f6','C':'#64748b'}[t.tier])),borderWidth:0,hoverOffset:8}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom',labels:{color:'#94a3b8',padding:16}}}}});
  }
}
function updateBadges(){
  document.getElementById('badge-events').textContent=stats.events?.total??0;
  document.getElementById('badge-speeches').textContent=stats.speeches?.total??0;
  document.getElementById('badge-leads').textContent=stats.leads?.total??0;
}

// ===== EVENTS =====
async function renderEvents(){
  const content=document.getElementById('content');
  const ha=document.getElementById('header-actions');
  ha.innerHTML='<button class="btn btn-primary" onclick="navigate(\'event-form\')">+ 新建活动</button>';
  let data;try{data=await api('/api/events')}catch(e){content.innerHTML=err(e);return}
  content.innerHTML=`
    <div class="search-bar">
      <input type="text" placeholder="搜索活动名称/主题/地点..." id="ev-search" oninput="searchEvents()">
      <select id="ev-status" onchange="searchEvents()"><option value="">全部状态</option><option value="筹备中">筹备中</option><option value="进行中">进行中</option><option value="已结束">已结束</option><option value="已取消">已取消</option></select>
    </div>
    <div class="card"><div class="table-wrap"><table>
      <tr><th>类型</th><th>活动名称</th><th>日期</th><th>地点</th><th>报名</th><th>到场</th><th>留资</th><th>MQL</th><th>状态</th><th>操作</th></tr>
      <tbody id="ev-tbody">${data.data.length?data.data.map(evRow).join(''):'<tr><td colspan="10"><div class="empty-state"><div class="icon">🎪</div><p>暂无活动</p></div></td></tr>'}</tbody>
    </table></div></div>`;
}
function evRow(e){
  const typeTag={'论坛':'blue','展会':'purple','参访':'green','峰会':'pink','沙龙':'cyan'}[e.event_type]||'gray';
  return `<tr class="clickable-row" onclick="navigate('event-detail',{id:${e.id}})">
    <td><span class="tag tag-${typeTag}">${e.event_type||'—'}</span></td>
    <td><strong>${esc(e.name)}</strong>${e.theme?'<br><span style="font-size:11px;color:var(--text-muted)">'+esc(e.theme)+'</span>':''}</td>
    <td>${e.date||'—'}</td><td>${esc(e.location)||'—'}</td>
    <td>${fmtNum(e.registration_count)}</td><td>${fmtNum(e.attendance_count)}</td>
    <td style="font-weight:700;color:var(--accent-light)">${e.leads_count||0}</td><td>${e.mql_count||0}</td>
    <td>${statusTag(e.status)}</td>
    <td><button class="btn btn-sm btn-secondary" onclick="event.stopPropagation();navigate('event-form',{id:${e.id}})">编辑</button></td>
  </tr>`;
}
async function searchEvents(){
  const q=document.getElementById('ev-search').value,st=document.getElementById('ev-status').value;
  const p=new URLSearchParams();if(q)p.set('search',q);if(st)p.set('status',st);
  try{const d=await api('/api/events?'+p);document.getElementById('ev-tbody').innerHTML=d.data.length?d.data.map(evRow).join(''):'<tr><td colspan="10"><div class="empty-state"><p>无匹配结果</p></div></td></tr>'}catch(e){toast(e.message,'error')}
}

// ===== EVENT DETAIL (对齐真实复盘报告) =====
async function renderEventDetail(id){
  const content=document.getElementById('content'),ha=document.getElementById('header-actions');
  try{
    const e=await api(`/api/events/${id}`);
    ha.innerHTML=`<button class="btn btn-secondary" onclick="navigate('events')">← 返回列表</button><button class="btn btn-primary" onclick="navigate('event-form',{id:${id}})">编辑</button>`;
    document.getElementById('page-title').textContent=`🎪 ${e.name}`;

    const indDist=tryParse(e.industry_distribution);
    const jobDist=tryParse(e.job_level_distribution);
    const deptDist=tryParse(e.dept_distribution);
    const channels=tryParse(e.channel_sources);
    const prodSigs=tryParse(e.product_signals);
    const indSigs=tryParse(e.industry_signals);
    const opps=tryParse(e.key_opportunities);
    const actions=tryParse(e.action_items);
    const attRate=e.registration_count>0?((e.attendance_count||0)/e.registration_count*100).toFixed(1):0;

    content.innerHTML=`
      <!-- 核心数据速览 -->
      <div class="stats-grid" style="grid-template-columns:repeat(6,1fr);margin-bottom:20px">
        ${[
          {v:fmtNum(e.registration_count),l:'报名人数',c:'var(--accent)',bg:'var(--accent-glow)'},
          {v:fmtNum(e.attendance_count),l:'到场人数',c:'var(--success)',bg:'var(--success-bg)'},
          {v:attRate+'%',l:'到场率',c:attRate>50?'var(--success)':'var(--warning)',bg:attRate>50?'var(--success-bg)':'var(--warning-bg)'},
          {v:e.vip_count||0,l:'VIP嘉宾',c:'var(--info)',bg:'var(--info-bg)'},
          {v:e.leads_count||0,l:'留资数',c:'var(--pink)',bg:'rgba(236,72,153,.12)'},
          {v:e.mql_count||0,l:'MQL',c:'var(--orange)',bg:'rgba(249,115,22,.12)'},
        ].map(s=>`<div class="stat-card"><div class="accent-bar" style="background:${s.c}"></div><div class="stat-value" style="color:${s.c}">${s.v}</div><div class="stat-label">${s.l}</div></div>`).join('')}
      </div>

      <!-- Tabs -->
      <div class="tabs" id="ev-tabs">
        <div class="tab active" onclick="switchEvTab(this,'overview')">概览</div>
        <div class="tab" onclick="switchEvTab(this,'analysis')">数据分析</div>
        <div class="tab" onclick="switchEvTab(this,'leads')">线索漏斗</div>
        <div class="tab" onclick="switchEvTab(this,'signals')">信号分析</div>
        <div class="tab" onclick="switchEvTab(this,'feedback')">现场反馈</div>
        <div class="tab" onclick="switchEvTab(this,'review')">复盘总结</div>
      </div>
      <div id="ev-tab-content">
        <!-- Overview tab (default) -->
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px">
          <div class="card"><div class="card-header"><h3>基本信息</h3></div><div class="card-body">
            <div class="detail-grid">
              <div><div class="detail-field"><div class="label">活动类型</div><div class="value"><span class="tag tag-blue">${e.event_type||'—'}</span></div></div></div>
              <div><div class="detail-field"><div class="label">日期</div><div class="value">${e.date||''}${e.end_date&&e.end_date!==e.date?' ~ '+e.end_date:''}</div></div></div>
              <div><div class="detail-field"><div class="label">地点</div><div class="value">${esc(e.location)}</div></div></div>
              <div><div class="detail-field"><div class="label">规模</div><div class="value">${fmtNum(e.scale)} 人</div></div></div>
              <div><div class="detail-field"><div class="label">主办方</div><div class="value">${esc(e.host)}</div></div></div>
              <div><div class="detail-field"><div class="label">目标客户群</div><div class="value">${esc(e.target_audience)}</div></div></div>
            </div>
          </div></div>
          <div class="card"><div class="card-header"><h3>⭐ 业务设计（独有输入项）</h3></div><div class="card-body">
            <div style="white-space:pre-wrap;line-height:1.8">${esc(e.business_design)||'<span style="color:var(--text-muted)">暂未填写。面对什么客户群？讲什么故事？Agenda是什么？</span>'}</div>
            ${e.product_solutions?`<div style="margin-top:12px"><div class="detail-field"><div class="label">产品/方案</div><div class="value">${esc(e.product_solutions)}</div></div></div>`:''}
            ${e.target_market?`<div><div class="detail-field"><div class="label">目标市场</div><div class="value">${esc(e.target_market)}</div></div></div>`:''}
          </div></div>
        </div>
      </div>
    `;

    // Store event data for tab switching
    window._evDetail={e,indDist,jobDist,deptDist,channels,prodSigs,indSigs,opps,actions,attRate};
  }catch(e){content.innerHTML=err(e)}
}

  if(tab==='overview'){
    tc.innerHTML=`

          </div>
        </div></div>
        <div class="card"><div class="card-header"><h3>⭐ 业务设计</h3></div><div class="card-body">
          <div style="white-space:pre-wrap;line-height:1.8">${esc(e.business_design)||'<span style="color:var(--text-muted)">暂未填写</span>'}</div>
          ${e.product_solutions?`<div style="margin-top:12px"><div class="detail-field"><div class="label">产品/方案</div><div class="value">${esc(e.product_solutions)}</div></div></div>`:''}
        </div></div>
      </div>`;
  } else if(tab==='analysis'){
    tc.innerHTML=`
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px">
        <div class="card"><div class="card-header"><h3>行业分布${indDist.length?' ('+indDist.length+')':''}</h3></div><div class="card-body">
          ${indDist.length?renderBars(indDist,'#3b82f6'):'<div class="empty-state" style="padding:16px"><p>暂无行业数据</p></div>'}
        </div></div>
        <div class="card"><div class="card-header"><h3>职级分布</h3></div><div class="card-body">
          ${jobDist.length?renderBars(jobDist,'#8b5cf6'):'<div class="empty-state" style="padding:16px"><p>暂无职级数据</p></div>'}
        </div></div>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px">
        <div class="card"><div class="card-header"><h3>部门分布</h3></div><div class="card-body">
          ${deptDist.length?renderBars(deptDist,'#10b981'):'<div class="empty-state" style="padding:16px"><p>暂无部门数据</p></div>'}
        </div></div>
        <div class="card"><div class="card-header"><h3>渠道来源</h3></div><div class="card-body">
          ${channels.length?renderBars(channels,'#f59e0b'):'<div class="empty-state" style="padding:16px"><p>暂无渠道数据</p></div>'}
        </div></div>
      </div>`;
  } else if(tab==='leads'){
    tc.innerHTML=`
      <div class="stats-grid" style="grid-template-columns:repeat(5,1fr);margin-bottom:16px">

function renderBars(data,color){
  const max=Math.max(...data.map(d=>d.count||d.pct||0),1);
  return `<div class="data-bars">${data.slice(0,12).map(d=>{
    const val=d.count||0;const pct=d.pct||0;const w=Math.max((val||pct)/max*100,2);
    return `<div class="data-bar-row"><div class="data-bar-label">${esc(d.name)}</div><div class="data-bar"><div class="data-bar-fill" style="width:${w}%;background:${color}"></div></div><div class="data-bar-value">${val?val+'人':''}${pct?' '+pct+'%':''}</div></div>`;
  }).join('')}</div>`;
}

let _leadsSearch='',_leadsStatus='',_leadsSource='',_leadsPage=1,_funnelData=null;
async function renderFunnel(){
  const content=document.getElementById('content');
  const ha=document.getElementById('header-actions');
  ha.innerHTML=`<button class="btn btn-secondary" onclick="if(confirm('确定清空所有线索数据？清空后需重新导入。'))clearAllLeads()">🗑️ 清空线索</button><button class="btn btn-sm btn-primary" onclick="openLeadForm()">+ 新建线索</button><button class="btn btn-primary" onclick="navigate('import')">📥 导入数据</button>`;
  content.innerHTML='<div style="text-align:center;padding:60px;color:var(--text-muted)">⏳ 加载数据...</div>';
  let data;try{data=await api('/api/leads/funnel');_funnelData=data}catch(e){content.innerHTML=err(e);return}
  const k=data.kpi||{};
  const mainFunnel=(data.funnel||[]).filter(s=>s.status!=='closed_lost');
  const lostCount=((data.funnel||[]).find(s=>s.status==='closed_lost')||{count:0}).count;
  const stageColors={new:'#475569',contacted:'#3b82f6',qualified:'#8b5cf6',opportunity:'#f59e0b',closed_won:'#10b981',closed_lost:'#ef4444'};

  // 计算逐阶段转化率
  const funnelRows=mainFunnel.map((s,i)=>{
    const prev=i>0?mainFunnel[i-1].count:s.count;
    const stageRate=prev>0?((s.count/prev)*100).toFixed(1):'100.0';
    return { ...s, stageRate, totalRate:k.total>0?((s.count/k.total)*100).toFixed(1):'0.0' };
  });

  content.innerHTML=`
    <div class="stats-grid" style="margin-bottom:20px;grid-template-columns:repeat(5,1fr)">
      ${[
        {v:fmtNum(k.total),l:'线索总量',c:'var(--accent)',icon:'📥'},
        {v:fmtNum(k.qualifiedCount),l:'转出线索数',c:'var(--info)',icon:'✅'},
        {v:(k.transferRate||'0.0')+'%',l:'转出率',c:'#8b5cf6',icon:'📊'},
        {v:fmtNum(k.opportunityCount),l:'商机数',c:'var(--warning)',icon:'💼'},
        {v:(k.totalDeal?fmtNum(k.totalDeal):'0')+'万',l:'成单金额',c:'var(--success)',icon:'💰'},
      ].map(s=>`<div class="stat-card animate-in"><div class="accent-bar" style="background:${s.c}"></div><div style="font-size:20px;margin-bottom:4px">${s.icon}</div><div class="stat-value" style="color:${s.c}">${s.v}</div><div class="stat-label">${s.l}</div></div>`).join('')}
    </div>

    <div style="display:grid;grid-template-columns:1.2fr 1fr;gap:16px;margin-bottom:16px">
      <div class="card"><div class="card-header"><h3>🔄 转化漏斗</h3></div><div class="card-body">
        ${mainFunnel.length?buildFunnelHTML(funnelRows,stageColors,k.total):'<div class="empty-state" style="padding:24px"><p>暂无线索数据</p></div>'}
        ${lostCount?`<div style="margin-top:12px;padding:10px 14px;background:var(--danger-bg);border:1px solid rgba(239,68,68,.2);border-radius:var(--radius);font-size:12px;color:var(--danger)">❌ 无效/丢单: <strong>${lostCount}</strong> 条</div>`:''}
      </div></div>
      <div class="card"><div class="card-header"><h3>📡 来源渠道分布</h3></div><div class="card-body">
        ${data.bySource&&data.bySource.length?renderHBars(data.bySource,'#3b82f6'):'<div class="empty-state" style="padding:24px"><p>暂无来源数据</p></div>'}
      </div></div>
    </div>

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px">
      <div class="card"><div class="card-header"><h3>🏷️ 产品分布</h3></div><div class="card-body">
        ${data.byProduct&&data.byProduct.length?renderHBars(data.byProduct,'#10b981'):'<div class="empty-state" style="padding:24px"><p>暂无产品数据</p></div>'}
      </div></div>
      <div class="card"><div class="card-header"><h3>👥 团队分配分布</h3></div><div class="card-body">
        ${data.byTeam&&data.byTeam.length?renderHBars(data.byTeam,'#8b5cf6'):'<div class="empty-state" style="padding:24px"><p>暂无团队数据</p></div>'}
      </div></div>
    </div>

    <div class="card" style="margin-bottom:16px"><div class="card-header"><h3>📈 月度趋势（进线量 vs 转出量）</h3></div><div class="card-body">
      ${data.monthlyTrend&&data.monthlyTrend.length?'<div class="chart-container" style="height:280px"><canvas id="chart-monthly"></canvas></div>':'<div class="empty-state" style="padding:24px"><p>暂无月度数据（需要 inbound_date 字段）</p></div>'}
    </div></div>

    <div class="card"><div class="card-header"><h3>📋 线索池</h3><button class="btn btn-sm btn-primary" onclick="openLeadForm()">+ 新建线索</button></div><div class="card-body" style="padding:16px">
      <div id="leads-table-container"><div style="text-align:center;padding:20px;color:var(--text-muted)">⏳ 加载线索...</div></div>
    </div></div>
  `;

  if(data.monthlyTrend&&data.monthlyTrend.length){
    const months=data.monthlyTrend.map(m=>m.month);
    const totals=data.monthlyTrend.map(m=>m.total);
    const transferred=data.monthlyTrend.map(m=>m.transferred);
    const rates=data.monthlyTrend.map(m=>m.total>0?(m.transferred/m.total*100).toFixed(1):0);
    charts.monthly=new Chart(document.getElementById('chart-monthly'),{
      type:'line',
      data:{labels:months,datasets:[
        {label:'进线量',data:totals,borderColor:'#3b82f6',backgroundColor:'rgba(59,130,246,.15)',tension:.3,fill:true,pointRadius:4,pointBackgroundColor:'#3b82f6'},
        {label:'转出量',data:transferred,borderColor:'#8b5cf6',backgroundColor:'rgba(139,92,246,.15)',tension:.3,fill:true,pointRadius:4,pointBackgroundColor:'#8b5cf6'},
        {label:'转出率%',data:rates,borderColor:'#10b981',backgroundColor:'transparent',borderDash:[5,5],tension:.3,pointRadius:3,pointBackgroundColor:'#10b981',yAxisID:'y1'}
      ]},
      options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{labels:{color:'#94a3b8',usePointStyle:true,padding:16}}},scales:{
        y:{beginAtZero:true,ticks:{color:'#64748b',precision:0},grid:{color:'rgba(51,65,85,.3)'},title:{display:true,text:'数量',color:'#64748b'}},
        y1:{position:'right',beginAtZero:true,max:100,ticks:{color:'#10b981',callback:v=>v+'%'},grid:{display:false},title:{display:true,text:'转出率',color:'#10b981'}},
        x:{ticks:{color:'#64748b'},grid:{display:false}}
      }}
    });
  }

  loadLeadsTable();
}

function buildFunnelHTML(rows,colors,total){
  if(!rows.length)return'';
  const topCount=rows[0].count||1;
  return `<div style="display:flex;flex-direction:column;gap:8px">
    ${rows.map((s,i)=>{
      const wPct=Math.max((s.count/topCount)*100,8);
      const isFirst=i===0;
      return `<div style="display:flex;align-items:center;gap:12px">
        <div style="min-width:72px;font-size:13px;font-weight:500;color:var(--text-secondary);text-align:right">${esc(s.name)}</div>
        <div style="flex:1;position:relative;height:36px;background:var(--bg-surface);border-radius:6px;overflow:hidden">
          <div style="width:${wPct}%;height:100%;background:linear-gradient(90deg,${colors[s.status]},${colors[s.status]}cc);border-radius:6px;display:flex;align-items:center;justify-content:flex-end;padding-right:12px;transition:width .8s cubic-bezier(.4,0,.2,1);min-width:40px">
            <span style="font-size:16px;font-weight:800;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.4)">${s.count}</span>
          </div>
        </div>
        <div style="min-width:80px;font-size:11px;color:var(--text-muted);text-align:left">
          ${isFirst?`<span style="color:${colors[s.status]}">起点</span>`:`<span style="color:${colors[s.status]};font-weight:600">↘ ${s.stageRate}%</span><br><span style="font-size:10px">总占比 ${s.totalRate}%</span>`}
        </div>
      </div>`;
    }).join('')}
  </div>`;
}

function renderHBars(items,color){
  if(!items||!items.length)return'';
  const max=Math.max(...items.map(i=>i.count),1);
  const palette=[color,'#8b5cf6','#10b981','#f59e0b','#ec4899','#06b6d4','#f97316','#6366f1','#84cc16','#ef4444'];
  return `<div class="data-bars">${items.slice(0,12).map((i,idx)=>{
    const pct=Math.max((i.count/max)*100,3);
    const c=palette[idx%palette.length];
    return `<div class="data-bar-row"><div class="data-bar-label" title="${esc(i.name)}">${esc(i.name)}</div><div class="data-bar"><div class="data-bar-fill" style="width:${pct}%;background:${c}"></div></div><div class="data-bar-value" style="color:${c}">${i.count}</div></div>`;
  }).join('')}</div>`;
}

        <option value="opportunity" ${_leadsStatus==='opportunity'?'selected':''}>商机</option>

      </select>

      </select>
      <button class="btn btn-sm btn-secondary" onclick="_leadsSearch=document.getElementById('leads-search').value;_leadsPage=1;loadLeadsTable()">🔍 搜索</button>
      <span style="margin-left:auto;font-size:12px;color:var(--text-muted)">共 ${data.total} 条 · ${_leadsPage}/${totalPages} 页</span>
    </div>
    <div class="table-wrap"><table>
      <tr><th>公司名称</th><th>联系人</th><th>职位</th><th>电话</th><th>来源渠道</th><th>产品</th><th>行业</th><th>团队</th><th>分配给</th><th>状态</th><th>进线日期</th><th>操作</th></tr>
      <tbody id="leads-tbody">${data.data.length?data.data.map(leadRow).join(''):'<tr><td colspan="12"><div class="empty-state" style="padding:24px"><p>暂无匹配数据</p></div></td></tr>'}</tbody>
    </table></div>
    ${totalPages>1?`<div style="display:flex;justify-content:center;gap:6px;margin-top:14px;align-items:center;flex-wrap:wrap">
      <button class="btn btn-sm btn-secondary" ${+_leadsPage<=1?'disabled style="opacity:.4;cursor:not-allowed"':''} onclick="_leadsPage=${_leadsPage-1};loadLeadsTable()">← 上页</button>
      ${renderPageNums(_leadsPage,totalPages)}
      <button class="btn btn-sm btn-secondary" ${+_leadsPage>=totalPages?'disabled style="opacity:.4;cursor:not-allowed"':''} onclick="_leadsPage=${_leadsPage+1};loadLeadsTable()">下页 →</button>
    </div>`:''}
  `;
}

function renderPageNums(cur,total){
  cur=+cur;total=+total;
  let pages=[];
  const add=p=>{if(p>=1&&p<=total&&!pages.includes(p))pages.push(p)};
  add(1);add(total);
  for(let i=cur-2;i<=cur+2;i++)add(i);
  pages.sort((a,b)=>a-b);
  let html='';let prev=0;
  for(const p of pages){
    if(p-prev>1)html+='<span style="color:var(--text-muted);padding:0 4px">…</span>';
    const active=p===cur;
    html+=`<button class="btn btn-sm ${active?'btn-primary':'btn-secondary'}" onclick="_leadsPage=${p};loadLeadsTable()" style="min-width:30px;padding:4px 8px">${p}</button>`;
    prev=p;
  }
  return html;
}

function renderDistBars(data,type,labelFn,valFn,defaultColor){

}

      <button class="btn btn-sm btn-secondary" onclick="openReportForm(${r.id},${r.account_id})">编辑</button>
      <button class="btn btn-sm btn-danger" onclick="if(confirm('确定删除这条报告？'))deleteReport(${r.id})">删除</button>
    </div>
    ${field('🔴','本期最重要的一件事',r.most_important,'highlight-box')}
    ${field('📝','重点工作',r.key_work)}
    ${field('❓','需要品鉴者决策',r.need_decision,'highlight-box insight')}
    ${field('🤝','跨线协同需求',r.cross_team_needs)}
    ${field('🚧','瓶颈/阻塞',r.bottlenecks)}
    ${field('➡️','下期最重要的一件事',r.next_important)}
  </div></div>`;
}

// Report CRUD
async function openReportForm(reportId,accountId){
  let r={};if(reportId){r=_accountReports.find(x=>x.id===reportId)||{}}
  openModal(`
    <div class="modal-header"><h3>${reportId?'编辑报告':'新增报告'}</h3><button onclick="closeModal()" style="font-size:20px">✕</button></div>
    <div class="modal-body"><form id="report-form" onsubmit="saveReport(event,${reportId||'null'},${accountId})">
      <div class="form-row">
        <div class="form-group"><label>报告类型</label><select name="report_type"><option value="weekly" ${r.report_type!=='monthly'?'selected':''}>周报</option><option value="monthly" ${r.report_type==='monthly'?'selected':''}>月报</option></select></div>
        <div class="form-group"><label>周期</label><input name="report_period" value="${esc(r.report_period||'')}" placeholder="如 2026-W39 或 2026-09"></div>
      </div>
      <div class="form-group"><label>🔴 本${r.report_type==='monthly'?'月':'周'}最重要的一件事</label><textarea name="most_important" rows="2" placeholder="一件事，不是三件事">${esc(r.most_important||'')}</textarea></div>
      <div class="form-group"><label>📝 重点工作（每行一条）</label><textarea name="key_work" rows="4" placeholder="1. 完成了什么\n2. 推进了什么\n3. ...">${esc(r.key_work||'')}</textarea></div>
      <div class="form-group"><label>❓ 需要品鉴者决策的事</label><textarea name="need_decision" rows="2" placeholder="需要拍板的事，没有则留空">${esc(r.need_decision||'')}</textarea></div>
      <div class="form-group"><label>🤝 跨线协同需求</label><textarea name="cross_team_needs" rows="2" placeholder="需要其他团队/部门配合的事">${esc(r.cross_team_needs||'')}</textarea></div>
      <div class="form-group"><label>🚧 瓶颈/阻塞</label><textarea name="bottlenecks" rows="2" placeholder="当前卡点是什么">${esc(r.bottlenecks||'')}</textarea></div>
      <div class="form-group"><label>➡️ 下${r.report_type==='monthly'?'月':'周'}最重要的一件事</label><textarea name="next_important" rows="2" placeholder="下期聚焦什么">${esc(r.next_important||'')}</textarea></div>
      <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:16px">
        <button type="button" class="btn btn-secondary" onclick="closeModal()">取消</button>
        <button type="submit" class="btn btn-primary">💾 保存</button>
      </div>
    </form></div>`);
}
async function saveReport(ev,reportId,accountId){
  ev.preventDefault();const body=Object.fromEntries(new FormData(document.getElementById('report-form')));
  try{
    if(reportId){await api('/api/accounts/reports/'+reportId,{method:'PUT',body});toast('报告更新成功')}
    else{await api(`/api/accounts/${accountId}/reports`,{method:'POST',body});toast('报告创建成功')}
    closeModal();renderAccountReport(accountId);
  }catch(e){toast(e.message,'error')}
}
async function deleteReport(reportId){
  try{await api('/api/accounts/reports/'+reportId,{method:'DELETE'});toast('删除成功');renderAccountReport(_accountReportData.id)}catch(e){toast(e.message,'error')}
}

// Contact CRUD
async function openContactForm(contactId,accountId){
  let c={};if(contactId){c=_accountContacts.find(x=>x.id===contactId)||{}}
  openModal(`
    <div class="modal-header"><h3>${contactId?'编辑联系人':'新增联系人'}</h3><button onclick="closeModal()" style="font-size:20px">✕</button></div>
    <div class="modal-body"><form id="contact-form" onsubmit="saveContact(event,${contactId||'null'},${accountId})">
      <div class="form-row">
        <div class="form-group"><label>姓名 *</label><input name="name" required value="${esc(c.name||'')}"></div>
        <div class="form-group"><label>职位</label><input name="title" value="${esc(c.title||'')}"></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>部门</label><input name="department" value="${esc(c.department||'')}"></div>
        <div class="form-group"><label>角色级别</label><select name="role_level"><option value="">请选择</option>${['决策层','管理层','执行层'].map(l=>`<option value="${l}" ${c.role_level===l?'selected':''}>${l}</option>`).join('')}</select></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>电话</label><input name="phone" value="${esc(c.phone||'')}"></div>
        <div class="form-group"><label>邮箱</label><input name="email" value="${esc(c.email||'')}"></div>
      </div>
      <div class="form-group"><label style="display:flex;align-items:center;gap:8px"><input type="checkbox" name="is_champion" value="1" ${c.is_champion?'checked':''} style="width:auto"> ⭐ 内部支持者/Champion</label></div>
      <div class="form-group"><label>备注</label><textarea name="notes" rows="2">${esc(c.notes||'')}</textarea></div>
      <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:16px">
        <button type="button" class="btn btn-secondary" onclick="closeModal()">取消</button>
        <button type="submit" class="btn btn-primary">💾 保存</button>
      </div>
    </form></div>`);
}
async function saveContact(ev,contactId,accountId){
  ev.preventDefault();const fd=new FormData(document.getElementById('contact-form'));const body=Object.fromEntries(fd);
  body.is_champion=fd.get('is_champion')?1:0;
  try{
    if(contactId){await api('/api/accounts/contacts/'+contactId,{method:'PUT',body});toast('联系人更新成功')}
    else{await api(`/api/accounts/${accountId}/contacts`,{method:'POST',body});toast('联系人创建成功')}
    closeModal();renderAccountReport(accountId);
  }catch(e){toast(e.message,'error')}
}
async function deleteContact(contactId){
  try{await api('/api/accounts/contacts/'+contactId,{method:'DELETE'});toast('删除成功');renderAccountReport(_accountReportData.id)}catch(e){toast(e.message,'error')}
}

// ===== HELPERS =====
function leadStatusName(s){return{new:'新进线',contacted:'已联系',qualified:'已转出',opportunity:'商机',closed_won:'成单',closed_lost:'无效/丢单'}[s]||s}
function leadStatusTag(s){const m={new:'gray',contacted:'blue',qualified:'purple',opportunity:'yellow',closed_won:'green',closed_lost:'red'};return `<span class="tag tag-${m[s]||'gray'}">${leadStatusName(s)}</span>`}
function stageName(s){return leadStatusName(s)}
function stageTag(s){return leadStatusTag(s)}
function eventStatusTag(s){const m={'筹备中':'blue','进行中':'yellow','已结束':'green','已取消':'gray'};return `<span class="tag tag-${m[s]||'gray'}">${esc(s)}</span>`}
function statusTag(s){return eventStatusTag(s)}
function sourceTag(s){if(!s)return'—';return `<span class="tag tag-blue">${esc(s)}</span>`}
function followUpTag(s){if(!s)return'—';const m={'待跟进':'yellow','跟进中':'blue','已完成':'green','已放弃':'gray'};return `<span class="tag tag-${m[s]||'gray'}">${esc(s)}</span>`}
function fmtNum(n){if(!n||n===0)return'0';if(n>=10000)return(n/10000).toFixed(1)+'万';if(n>=1000)return n.toLocaleString();return n}
function tryParse(s){try{return JSON.parse(s)||[]}catch{return[]}}
function openModal(h){document.getElementById('modal').innerHTML=h;document.getElementById('modal-overlay').classList.add('active')}
function closeModal(){document.getElementById('modal-overlay').classList.remove('active')}
async function deleteItem(t,id,name){if(!confirm(`确定删除「${name}」？`))return;try{await api(`/api/${t}/${id}`,{method:'DELETE'});toast('删除成功');navigate(t==='leads'?'funnel':t)}catch(e){toast(e.message,'error')}}

// ===== INIT =====
navigate('dashboard');
</script>
