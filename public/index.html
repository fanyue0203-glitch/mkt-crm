<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MKT-CRM · 市场部 AI-Native 工作台</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --primary:#0f172a;--primary-light:#1e293b;
  --accent:#3b82f6;--accent-light:#60a5fa;--accent-dark:#1d4ed8;
  --accent-glow:rgba(59,130,246,.15);
  --bg:#0f172a;--bg-card:#1e293b;--bg-card-hover:#263548;--bg-surface:#162032;
  --border:#334155;--border-light:#475569;
  --text:#f1f5f9;--text-secondary:#94a3b8;--text-muted:#64748b;--text-bright:#fff;
  --success:#10b981;--success-bg:rgba(16,185,129,.12);
  --warning:#f59e0b;--warning-bg:rgba(245,158,11,.12);
  --danger:#ef4444;--danger-bg:rgba(239,68,68,.12);
  --info:#8b5cf6;--info-bg:rgba(139,92,246,.12);
  --pink:#ec4899;--cyan:#06b6d4;--orange:#f97316;
  --shadow:0 1px 3px rgba(0,0,0,.3);
  --shadow-md:0 4px 12px rgba(0,0,0,.3);
  --shadow-lg:0 10px 25px rgba(0,0,0,.4);
  --shadow-glow:0 0 20px rgba(59,130,246,.15);
  --radius:8px;--radius-lg:12px;--radius-xl:16px;
  --sidebar-w:240px;--header-h:56px;
  --tier-s:#ef4444;--tier-a:#f97316;--tier-b:#3b82f6;--tier-c:#64748b;
  --gradient-hero:linear-gradient(135deg,#0f172a 0%,#1e1b4b 50%,#0c1426 100%);
  --gradient-accent:linear-gradient(135deg,#3b82f6,#8b5cf6);
  --gradient-green:linear-gradient(135deg,#10b981,#06b6d4);
  --gradient-pink:linear-gradient(135deg,#ec4899,#f97316);
  --gradient-orange:linear-gradient(135deg,#f97316,#eab308);
}
html{font-size:14px;-webkit-font-smoothing:antialiased}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);line-height:1.6}
a{color:var(--accent-light);text-decoration:none}
button{cursor:pointer;font-family:inherit;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:inherit;border:1px solid var(--border);border-radius:var(--radius);padding:8px 12px;outline:none;transition:border-color .2s;background:var(--bg-surface);color:var(--text)}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
textarea{resize:vertical;min-height:80px}
select option{background:var(--bg-card);color:var(--text)}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}

/* Layout */
.layout{display:flex;min-height:100vh}
.sidebar{width:var(--sidebar-w);background:linear-gradient(180deg,#0c1220 0%,#0a0f1a 100%);color:#fff;position:fixed;top:0;left:0;bottom:0;z-index:100;display:flex;flex-direction:column;overflow-y:auto;border-right:1px solid rgba(255,255,255,.06)}
.sidebar-logo{padding:20px;border-bottom:1px solid rgba(255,255,255,.06)}
.sidebar-logo h1{font-size:15px;font-weight:700;color:#fff;display:flex;align-items:center;gap:8px}
.sidebar-logo small{display:block;font-size:11px;color:var(--text-muted);font-weight:400;margin-top:4px;letter-spacing:.5px}
.sidebar-nav{flex:1;padding:12px 0}
.nav-section{padding:0 10px;margin-bottom:4px}
.nav-section-title{font-size:10px;text-transform:uppercase;color:var(--text-muted);padding:12px 12px 4px;letter-spacing:1px;font-weight:600}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:var(--radius);color:var(--text-secondary);font-size:13px;cursor:pointer;transition:all .15s;margin:1px 0;position:relative}
.nav-item:hover{background:rgba(255,255,255,.05);color:var(--text)}
.nav-item.active{background:var(--accent-glow);color:var(--accent-light);font-weight:600}
.nav-item.active::before{content:'';position:absolute;left:0;top:50%;transform:translateY(-50%);width:3px;height:20px;background:var(--accent);border-radius:0 2px 2px 0}
.nav-item .icon{font-size:16px;width:20px;text-align:center}
.nav-item .badge{margin-left:auto;background:rgba(59,130,246,.2);color:var(--accent-light);padding:1px 7px;border-radius:10px;font-size:11px;font-weight:600}

.main{margin-left:var(--sidebar-w);flex:1;min-width:0}
.header{height:var(--header-h);background:rgba(15,23,42,.8);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 24px;position:sticky;top:0;z-index:50}
.header h2{font-size:15px;font-weight:600;color:var(--text)}
.header-actions{display:flex;gap:8px;align-items:center}
.content{padding:24px}

/* Cards */
.card{background:var(--bg-card);border-radius:var(--radius-lg);border:1px solid var(--border);box-shadow:var(--shadow);transition:border-color .2s}
.card:hover{border-color:var(--border-light)}
.card-header{padding:14px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.card-header h3{font-size:13px;font-weight:600;color:var(--text)}
.card-body{padding:20px}

/* Buttons */
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:var(--radius);font-size:13px;font-weight:500;transition:all .15s;border:1px solid transparent}
.btn-primary{background:var(--gradient-accent);color:#fff;border:none;box-shadow:0 2px 8px rgba(59,130,246,.3)}
.btn-primary:hover{box-shadow:0 4px 12px rgba(59,130,246,.4);transform:translateY(-1px)}
.btn-secondary{background:var(--bg-surface);color:var(--text);border:1px solid var(--border)}
.btn-secondary:hover{background:var(--bg-card-hover);border-color:var(--border-light)}
.btn-danger{background:var(--danger-bg);color:var(--danger);border:1px solid rgba(239,68,68,.2)}
.btn-danger:hover{background:rgba(239,68,68,.2)}
.btn-sm{padding:5px 10px;font-size:12px}

/* Hero Stats (Dashboard) */
.hero{background:var(--gradient-hero);border-radius:var(--radius-xl);padding:32px;margin-bottom:24px;position:relative;overflow:hidden;border:1px solid rgba(59,130,246,.1)}
.hero::before{content:'';position:absolute;top:-50%;right:-20%;width:400px;height:400px;background:radial-gradient(circle,rgba(59,130,246,.08) 0%,transparent 70%);pointer-events:none}
.hero::after{content:'';position:absolute;bottom:-30%;left:10%;width:300px;height:300px;background:radial-gradient(circle,rgba(139,92,246,.06) 0%,transparent 70%);pointer-events:none}
.hero-title{font-size:20px;font-weight:700;color:var(--text-bright);margin-bottom:4px;position:relative}
.hero-sub{font-size:12px;color:var(--text-muted);margin-bottom:24px;position:relative}
.hero-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;position:relative}
.hero-stat{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.06);border-radius:var(--radius-lg);padding:20px;text-align:center;cursor:pointer;transition:all .2s}
.hero-stat:hover{background:rgba(255,255,255,.07);transform:translateY(-2px);box-shadow:var(--shadow-glow)}
.hero-stat .icon{font-size:28px;margin-bottom:8px;display:block}
.hero-stat .value{font-size:36px;font-weight:800;background:var(--gradient-accent);-webkit-background-clip:text;-webkit-text-fill-color:transparent;line-height:1.1}
.hero-stat .value.green{background:var(--gradient-green);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.hero-stat .value.pink{background:var(--gradient-pink);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.hero-stat .value.orange{background:var(--gradient-orange);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.hero-stat .label{font-size:12px;color:var(--text-secondary);margin-top:4px}
.hero-stat .sub{font-size:11px;color:var(--text-muted);margin-top:6px}

/* Stats Grid */
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:20px}
.stat-card{background:var(--bg-card);border-radius:var(--radius-lg);padding:16px 20px;border:1px solid var(--border);cursor:pointer;transition:all .2s;position:relative;overflow:hidden}
.stat-card:hover{border-color:var(--accent);box-shadow:var(--shadow-glow);transform:translateY(-1px)}
.stat-card .accent-bar{position:absolute;top:0;left:0;right:0;height:2px}
.stat-card .stat-value{font-size:24px;font-weight:800;margin:4px 0 2px}
.stat-card .stat-label{font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.5px}
.stat-card .stat-sub{font-size:11px;color:var(--text-secondary);margin-top:6px}

/* Tables */
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{text-align:left;padding:10px 12px;font-size:11px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid var(--border)}
td{padding:10px 12px;font-size:13px;border-bottom:1px solid rgba(51,65,85,.5);vertical-align:top}
tr:hover td{background:rgba(255,255,255,.02)}
.clickable-row{cursor:pointer}
.clickable-row:hover td{background:var(--accent-glow)}

/* Tags */
.tag{display:inline-flex;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:500}
.tag-blue{background:rgba(59,130,246,.15);color:#60a5fa}
.tag-green{background:rgba(16,185,129,.15);color:#34d399}
.tag-yellow{background:rgba(245,158,11,.15);color:#fbbf24}
.tag-red{background:rgba(239,68,68,.15);color:#f87171}
.tag-gray{background:rgba(100,116,139,.15);color:#94a3b8}
.tag-purple{background:rgba(139,92,246,.15);color:#a78bfa}
.tag-pink{background:rgba(236,72,153,.15);color:#f472b6}
.tag-cyan{background:rgba(6,182,212,.15);color:#22d3ee}
.tier-badge{display:inline-flex;width:26px;height:26px;border-radius:6px;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff}
.tier-S{background:var(--tier-s);box-shadow:0 0 8px rgba(239,68,68,.3)}
.tier-A{background:var(--tier-a);box-shadow:0 0 8px rgba(249,115,22,.3)}
.tier-B{background:var(--tier-b);box-shadow:0 0 8px rgba(59,130,246,.3)}
.tier-C{background:var(--tier-c)}

/* Forms */
.form-group{margin-bottom:16px}
.form-group label{display:block;font-size:12px;font-weight:600;color:var(--text-secondary);margin-bottom:4px}
.form-group input,.form-group select,.form-group textarea{width:100%;display:block}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.form-row-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px}

/* Funnel */
.funnel{display:flex;flex-direction:column;gap:6px;max-width:600px}
.funnel-stage{display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:var(--radius);background:var(--bg-card);border:1px solid var(--border);transition:all .15s}
.funnel-stage:hover{border-color:var(--accent);box-shadow:var(--shadow-glow)}
.funnel-bar{height:28px;border-radius:4px;min-width:4px;transition:width .8s cubic-bezier(.4,0,.2,1)}
.funnel-label{font-size:13px;font-weight:500;min-width:80px}
.funnel-count{font-size:20px;font-weight:800;min-width:50px;text-align:right}
.funnel-pct{font-size:11px;color:var(--text-muted);min-width:40px}

/* Detail */
.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.detail-field{margin-bottom:12px}
.detail-field .label{font-size:11px;color:var(--text-muted);margin-bottom:2px;text-transform:uppercase;letter-spacing:.5px}
.detail-field .value{font-size:14px;color:var(--text)}
.detail-field .value:empty::after{content:'—';color:var(--text-muted)}

/* Metric Ring */
.metric-ring{display:flex;align-items:center;gap:16px;padding:16px;background:var(--bg-surface);border-radius:var(--radius-lg);border:1px solid var(--border)}
.metric-ring .ring{width:64px;height:64px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:800;border:3px solid var(--accent);position:relative}
.metric-ring .ring-label{font-size:12px;color:var(--text-secondary)}
.metric-ring .ring-sub{font-size:11px;color:var(--text-muted)}

/* Data Bar (horizontal bar chart in HTML) */
.data-bars{display:flex;flex-direction:column;gap:6px}
.data-bar-row{display:flex;align-items:center;gap:8px;font-size:12px}
.data-bar-label{min-width:100px;color:var(--text-secondary);text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.data-bar{flex:1;height:20px;background:var(--bg-surface);border-radius:3px;overflow:hidden}
.data-bar-fill{height:100%;border-radius:3px;transition:width .6s ease;min-width:2px}
.data-bar-value{min-width:50px;font-weight:600;font-size:11px;color:var(--text-muted)}

/* Tabs */
.tabs{display:flex;gap:0;border-bottom:1px solid var(--border);margin-bottom:20px;overflow-x:auto}
.tab{padding:10px 20px;font-size:13px;font-weight:500;color:var(--text-muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;transition:all .15s;white-space:nowrap}
.tab:hover{color:var(--text)}
.tab.active{color:var(--accent-light);border-bottom-color:var(--accent);font-weight:600}

/* Search */
.search-bar{display:flex;gap:8px;margin-bottom:16px;align-items:center}
.search-bar input{flex:1;max-width:320px}
.search-bar select{min-width:120px}

/* Upload */
.upload-area{border:2px dashed var(--border);border-radius:var(--radius-xl);padding:40px;text-align:center;cursor:pointer;transition:all .2s}
.upload-area:hover,.upload-area.dragover{border-color:var(--accent);background:var(--accent-glow)}
.upload-area .icon{font-size:36px;margin-bottom:8px}
.upload-area p{color:var(--text-secondary);font-size:13px}

/* Empty state */
.empty-state{text-align:center;padding:48px 24px;color:var(--text-muted)}
.empty-state .icon{font-size:48px;margin-bottom:12px}
.empty-state p{font-size:14px;margin-bottom:16px}

/* Opportunity table */
.opp-level{display:inline-flex;padding:3px 10px;border-radius:4px;font-size:11px;font-weight:600;letter-spacing:.3px}
.opp-商机{background:rgba(239,68,68,.15);color:#f87171}
.opp-高潜{background:rgba(249,115,22,.15);color:#fb923c}
.opp-战略{background:rgba(139,92,246,.15);color:#a78bfa}
.opp-关注{background:rgba(59,130,246,.15);color:#60a5fa}
.opp-待分配{background:rgba(100,116,139,.15);color:#94a3b8}

/* Signal chips */
.signal-chip{display:inline-flex;align-items:center;gap:4px;padding:6px 12px;background:var(--bg-surface);border:1px solid var(--border);border-radius:20px;font-size:12px;margin:3px}
.signal-chip .count{background:var(--accent);color:#fff;border-radius:10px;padding:0 6px;font-size:10px;font-weight:700}

/* Chart container */
.chart-container{position:relative;height:260px}

/* Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(4px);z-index:200;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .2s}
.modal-overlay.active{opacity:1;pointer-events:all}
.modal{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-xl);width:90%;max-width:640px;max-height:85vh;overflow-y:auto;box-shadow:var(--shadow-lg)}
.modal-header{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.modal-body{padding:20px}
.modal-footer{padding:12px 20px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px}

/* Toast */
.toast-container{position:fixed;top:16px;right:16px;z-index:300;display:flex;flex-direction:column;gap:8px}
.toast{padding:12px 16px;border-radius:var(--radius);background:var(--bg-card);border:1px solid var(--border);box-shadow:var(--shadow-lg);font-size:13px;animation:slideIn .3s ease}
.toast-success{border-left:3px solid var(--success)}
.toast-error{border-left:3px solid var(--danger)}
@keyframes slideIn{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}

/* Highlight box */
.highlight-box{background:var(--bg-surface);border:1px solid var(--border);border-left:3px solid var(--accent);border-radius:var(--radius);padding:16px;margin-bottom:12px;font-size:13px;line-height:1.7}
.highlight-box.insight{border-left-color:var(--warning)}
.highlight-box.danger{border-left-color:var(--danger)}
.highlight-box.success{border-left-color:var(--success)}

/* Responsive */
@media(max-width:768px){
  .sidebar{display:none}.main{margin-left:0}
  .hero-stats{grid-template-columns:1fr 1fr}
  .form-row,.form-row-3,.detail-grid{grid-template-columns:1fr}
}

/* Animate counter */
@keyframes countUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.animate-in{animation:countUp .4s ease both}

/* Octo 大客户模块 */
.timeline{display:flex;flex-direction:column;gap:16px}
.report-card{position:relative}
.report-card .report-meta{display:flex;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.report-card .report-period{font-size:15px;font-weight:700;color:var(--accent-light)}
.report-card .report-type-badge{padding:2px 8px;border-radius:4px;font-size:11px;font-weight:600}
.report-type-weekly{background:rgba(59,130,246,.15);color:#60a5fa}
.report-type-monthly{background:rgba(139,92,246,.15);color:#a78bfa}
.report-card .report-field{margin-bottom:10px}
.report-card .report-field-label{font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px;display:flex;align-items:center;gap:4px}
.report-card .report-field-value{font-size:13px;line-height:1.7;white-space:pre-wrap}
.kpi-row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}
.decision-card{background:var(--bg-card);border:1px solid var(--border);border-left:3px solid var(--warning);border-radius:var(--radius);padding:14px 18px;margin-bottom:8px;cursor:pointer;transition:all .15s}
.decision-card:hover{border-color:var(--warning);background:var(--bg-card-hover)}
.decision-card .dc-company{font-size:12px;color:var(--accent-light);font-weight:600;margin-bottom:4px}
.decision-card .dc-period{font-size:11px;color:var(--text-muted);margin-left:8px}
.decision-card .dc-content{font-size:13px;line-height:1.6}
.timeline-item{display:flex;gap:14px;position:relative;padding-bottom:14px;border-bottom:1px solid rgba(51,65,85,.3)}
.timeline-item:last-child{border-bottom:none;padding-bottom:0}
.timeline-dot{width:10px;height:10px;border-radius:50%;background:var(--accent);margin-top:6px;flex-shrink:0;box-shadow:0 0 0 3px var(--accent-glow)}
.timeline-content{flex:1;min-width:0}
.timeline-item .ti-header{display:flex;gap:8px;align-items:center;margin-bottom:4px;flex-wrap:wrap}
.timeline-item .ti-company{font-weight:600;font-size:13px;cursor:pointer;color:var(--accent-light)}
.timeline-item .ti-company:hover{text-decoration:underline}
.timeline-item .ti-period{font-size:11px;color:var(--text-muted);background:var(--bg-surface);padding:1px 6px;border-radius:3px}
.timeline-item .ti-most{font-size:12px;color:var(--text-secondary);line-height:1.5;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.champion-tag{background:linear-gradient(135deg,#f59e0b,#ec4899);color:#fff;padding:2px 8px;border-radius:4px;font-size:10px;font-weight:700;letter-spacing:.3px}
.account-header{display:flex;align-items:center;gap:16px;margin-bottom:20px;padding:20px 24px;background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-lg)}
.account-header .ah-name{font-size:20px;font-weight:700}
.account-header .ah-meta{display:flex;gap:12px;margin-top:6px;flex-wrap:wrap;font-size:12px;color:var(--text-secondary)}
.sub-tabs{display:flex;gap:0;border-bottom:1px solid var(--border);margin-bottom:20px}

/* 大客户复盘新增样式 */
.stage-tag{display:inline-flex;padding:3px 10px;border-radius:4px;font-size:11px;font-weight:600;letter-spacing:.2px}
.stage-已签约{background:rgba(16,185,129,.15);color:#34d399}
.stage-交付中{background:rgba(6,182,212,.15);color:#22d3ee}
.stage-投标中{background:rgba(245,158,11,.15);color:#fbbf24}
.stage-POC中{background:rgba(139,92,246,.15);color:#a78bfa}
.stage-重点推进{background:rgba(59,130,246,.15);color:#60a5fa}
.stage-B类重点推进{background:rgba(59,130,246,.15);color:#60a5fa}
.stage-跟进中{background:rgba(100,116,139,.15);color:#94a3b8}
.stage-C类跟进{background:rgba(100,116,139,.15);color:#94a3b8}
.stage-观察{background:rgba(100,116,139,.1);color:#94a3b8}
.stage-D类观察{background:rgba(100,116,139,.1);color:#94a3b8}
.stage-战败{background:rgba(239,68,68,.15);color:#f87171}
.stage-放弃{background:rgba(239,68,68,.15);color:#f87171}
.amount-hero{font-size:28px;font-weight:800;background:var(--gradient-accent);-webkit-background-clip:text;-webkit-text-fill-color:transparent;line-height:1.2}
.amount-hero.green{background:var(--gradient-green);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.pipeline-bar{display:flex;height:32px;border-radius:8px;overflow:hidden;margin:12px 0;box-shadow:inset 0 1px 3px rgba(0,0,0,.2)}
.pipeline-seg{display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#fff;transition:width .6s ease;min-width:30px;white-space:nowrap;padding:0 4px}
.pipeline-legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:8px}
.pipeline-legend-item{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--text-secondary)}
.pipeline-legend-dot{width:10px;height:10px;border-radius:3px}
.blocker-card{background:var(--bg-card);border:1px solid rgba(239,68,68,.25);border-left:3px solid var(--danger);border-radius:var(--radius);padding:14px 18px;margin-bottom:8px;transition:all .15s;cursor:pointer}
.blocker-card:hover{background:var(--bg-card-hover);border-color:rgba(239,68,68,.4)}
.blocker-card .bc-company{font-size:12px;font-weight:600;color:#f87171;margin-bottom:4px}
.blocker-card .bc-blocker{font-size:13px;line-height:1.6;color:var(--text)}
.deadline-card{background:var(--bg-card);border:1px solid rgba(245,158,11,.2);border-left:3px solid var(--warning);border-radius:var(--radius);padding:12px 16px;margin-bottom:6px;display:flex;align-items:center;gap:10px;cursor:pointer;transition:all .15s}
.deadline-card:hover{background:var(--bg-card-hover);border-color:rgba(245,158,11,.35)}
.deadline-card .dl-date{font-size:11px;font-weight:700;color:var(--warning);min-width:80px}
.deadline-card .dl-content{flex:1}
.deadline-card .dl-company{font-size:12px;font-weight:600;color:var(--accent-light)}
.deadline-card .dl-step{font-size:12px;color:var(--text-secondary)}
.lesson-card{background:var(--bg-card);border:1px solid var(--border);border-left:4px solid var(--danger);border-radius:var(--radius);padding:16px 20px;margin-bottom:10px}
.lesson-card .lc-company{font-size:12px;font-weight:700;color:var(--danger);margin-bottom:6px}
.lesson-card .lc-content{font-size:13px;line-height:1.7;color:var(--text-secondary)}

/* ===== Panoramic Report (全景报告) ===== */
.panorama{display:flex;flex-direction:column;gap:20px}
.section-card{background:var(--bg-card);border-radius:var(--radius-lg);border:1px solid var(--border);box-shadow:var(--shadow-md);overflow:hidden}
.section-card.highlight-red{border-color:rgba(239,68,68,.5);box-shadow:0 0 20px rgba(239,68,68,.12)}
.section-card.highlight-red .section-header{background:linear-gradient(90deg,rgba(239,68,68,.08),transparent)}
.section-header{padding:16px 22px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px}
.section-header h3{font-size:15px;font-weight:700;color:var(--text-bright);display:flex;align-items:center;gap:8px}
.section-header .section-count{margin-left:auto;font-size:12px;color:var(--text-muted);background:var(--bg-surface);padding:2px 10px;border-radius:10px}
.section-body{padding:20px 22px}

/* Strategy section */
.strategy-quotes{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px;margin-bottom:20px}
.strategy-quote{background:var(--bg-surface);border-left:3px solid var(--accent);padding:12px 16px;border-radius:0 var(--radius) var(--radius) 0;font-size:13px;line-height:1.6}
.strategy-quote .sq-who{font-size:11px;color:var(--accent-light);font-weight:600;margin-bottom:3px}
.strategy-quote .sq-text{color:var(--text);font-style:italic}
.strategy-overview{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:20px}
.overview-item{background:var(--bg-surface);border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px;text-align:center}
.overview-item .ov-value{font-size:22px;font-weight:800}
.overview-item .ov-label{font-size:11px;color:var(--text-muted);margin-top:3px}
.funnel-strip{background:var(--bg-surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 18px;margin-bottom:12px}
.funnel-strip h4{font-size:12px;color:var(--text-secondary);margin-bottom:10px;font-weight:600}
.funnel-row{display:flex;align-items:center;gap:8px;font-size:12px;margin-bottom:6px}
.funnel-row .fl-label{min-width:80px;color:var(--text-secondary)}
.funnel-row .fl-bar{flex:1;height:18px;background:var(--bg);border-radius:3px;overflow:hidden}
.funnel-row .fl-fill{height:100%;background:var(--gradient-accent);border-radius:3px}
.funnel-row .fl-val{min-width:60px;font-weight:700;color:var(--text-bright);font-size:13px}
.conclusion-box{background:linear-gradient(135deg,rgba(139,92,246,.1),rgba(59,130,246,.1));border:1px solid rgba(139,92,246,.3);border-radius:var(--radius);padding:14px 18px;font-size:13px;line-height:1.7;color:var(--text)}
.conclusion-box strong{color:#c4b5fd}

/* Signed / Bidding cards */
.client-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.signed-card{background:var(--bg-surface);border:1px solid rgba(16,185,129,.25);border-radius:var(--radius-lg);padding:18px;transition:all .15s}
.signed-card:hover{border-color:var(--success);box-shadow:0 0 16px rgba(16,185,129,.12);transform:translateY(-2px)}
.signed-card .sc-top{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.signed-card .sc-name{font-size:15px;font-weight:700;color:var(--text-bright);cursor:pointer}
.signed-card .sc-name:hover{color:var(--accent-light)}
.signed-card .sc-amount{font-size:26px;font-weight:800;color:var(--success);margin:8px 0}
.signed-card .sc-amount small{font-size:12px;color:var(--text-muted);font-weight:400;margin-left:4px}
.signed-card .sc-owner{font-size:11px;color:var(--text-secondary);margin-bottom:8px}
.signed-card .sc-status{font-size:13px;color:var(--text);line-height:1.6;margin-bottom:6px}
.signed-card .sc-next{font-size:12px;color:var(--text-muted);padding-top:8px;border-top:1px solid var(--border)}

/* Bidding (red highlight) */
.bidding-card{background:linear-gradient(135deg,rgba(239,68,68,.08),rgba(245,158,11,.08));border:2px solid rgba(239,68,68,.5);border-radius:var(--radius-lg);padding:20px;position:relative}
.bidding-card .countdown{display:inline-flex;align-items:center;gap:6px;background:var(--danger);color:#fff;font-size:12px;font-weight:700;padding:4px 12px;border-radius:12px;animation:pulse-red 2s infinite}
@keyframes pulse-red{0%,100%{box-shadow:0 0 0 0 rgba(239,68,68,.5)}50%{box-shadow:0 0 0 8px rgba(239,68,68,0)}}
.bidding-card .bc-name{font-size:20px;font-weight:800;color:var(--text-bright);cursor:pointer}
.bidding-card .bc-name:hover{color:var(--danger)}
.bidding-card .bc-amount{font-size:32px;font-weight:800;color:#f87171;margin:8px 0}
.bidding-card .bc-meta{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
.bidding-card .bc-meta-item{background:rgba(0,0,0,.2);border-radius:var(--radius);padding:8px 12px}
.bidding-card .bc-meta-label{font-size:10px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.5px}
.bidding-card .bc-meta-value{font-size:13px;color:var(--text-bright);font-weight:600;margin-top:2px}
.bidding-card .bc-quote{background:rgba(239,68,68,.15);border-left:3px solid var(--danger);padding:10px 14px;border-radius:0 var(--radius) var(--radius) 0;font-size:13px;font-style:italic;color:#fca5a5;margin-top:10px}

/* B class cards */
.bclass-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.bclass-card{background:var(--bg-surface);border:1px solid rgba(59,130,246,.2);border-radius:var(--radius);padding:14px 16px;transition:all .15s;cursor:pointer}
.bclass-card:hover{border-color:var(--accent);background:var(--bg-card-hover)}
.bclass-card .bcc-top{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.bclass-card .bcc-name{font-size:14px;font-weight:700;color:var(--text-bright)}
.bclass-card .bcc-amount{font-size:13px;color:var(--accent-light);font-weight:700}
.bclass-card .bcc-owner{font-size:11px;color:var(--text-secondary);margin-bottom:6px}
.bclass-card .bcc-status{font-size:12px;color:var(--text);line-height:1.5;margin-bottom:4px}
.bclass-card .bcc-blocker{font-size:11px;color:#fbbf24;margin-top:4px;padding-top:4px;border-top:1px dashed rgba(245,158,11,.3)}

/* C class compact list */
.compact-list{display:flex;flex-direction:column;gap:6px}
.compact-item{display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--bg-surface);border-radius:var(--radius);font-size:12px;cursor:pointer;transition:background .15s}
.compact-item:hover{background:var(--bg-card-hover)}
.compact-item .ci-name{font-weight:600;color:var(--text-bright);min-width:100px}
.compact-item .ci-name:hover{color:var(--accent-light)}
.compact-item .ci-status{flex:1;color:var(--text-secondary)}
.compact-item .ci-owner{font-size:11px;color:var(--text-muted)}

/* Dead groups */
.dead-group{margin-bottom:14px}
.dead-group-header{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--bg-surface);border-radius:var(--radius) var(--radius) 0 0;border-bottom:1px solid var(--border);font-size:13px;font-weight:600}
.dead-group-header .dg-desc{font-size:11px;font-weight:400;color:var(--text-muted);margin-left:8px}
.dead-item{padding:8px 12px;background:rgba(0,0,0,.15);border-bottom:1px solid rgba(51,65,85,.3);font-size:12px;display:flex;gap:8px}
.dead-item:last-child{border-radius:0 0 var(--radius) var(--radius);border-bottom:none}
.dead-item .di-name{font-weight:600;color:var(--danger);min-width:90px}
.dead-item .di-lesson{color:var(--text-secondary);flex:1;line-height:1.5}

.lessons-summary{margin-top:16px;display:flex;flex-direction:column;gap:8px}
.lesson-item{display:flex;gap:10px;align-items:flex-start;padding:10px 14px;background:var(--danger-bg);border-left:3px solid var(--danger);border-radius:0 var(--radius) var(--radius) 0;font-size:12px;line-height:1.6;color:var(--text)}
.lesson-item .li-num{background:var(--danger);color:#fff;font-size:10px;font-weight:700;width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px}

/* Top concerns */
.concern-list{display:flex;flex-direction:column;gap:8px}
.concern-item{display:flex;gap:12px;padding:12px 16px;background:var(--bg-surface);border-radius:var(--radius);border:1px solid var(--border)}
.concern-item .ci-rank{width:28px;height:28px;border-radius:50%;background:var(--gradient-accent);color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;flex-shrink:0}
.concern-item .ci-title{font-size:14px;font-weight:700;color:var(--text-bright);margin-bottom:3px}
.concern-item .ci-desc{font-size:12px;color:var(--text-secondary);line-height:1.5}

/* Action items */
.action-list{display:flex;flex-direction:column;gap:6px}
.action-item{display:flex;align-items:flex-start;gap:10px;padding:10px 14px;border-radius:var(--radius);border-left:3px solid;font-size:12px;line-height:1.6;cursor:pointer;transition:all .15s}
.action-item:hover{filter:brightness(1.15)}
.action-item.red{background:rgba(239,68,68,.08);border-left-color:var(--danger)}
.action-item.yellow{background:rgba(245,158,11,.08);border-left-color:var(--warning)}
.action-item.blue{background:rgba(59,130,246,.08);border-left-color:var(--accent)}
.action-item .ai-prio{font-size:10px;font-weight:700;padding:2px 7px;border-radius:8px;flex-shrink:0;margin-top:1px}
.action-item.red .ai-prio{background:var(--danger);color:#fff}
.action-item.yellow .ai-prio{background:var(--warning);color:#000}
.action-item.blue .ai-prio{background:var(--accent);color:#fff}
.action-item .ai-company{font-weight:700;color:var(--text-bright);min-width:80px;flex-shrink:0}
.action-item .ai-content{flex:1;color:var(--text)}
.action-item .ai-owner{font-size:11px;color:var(--text-muted);flex-shrink:0}

/* Tier D */
.tier-D{background:#475569;box-shadow:0 0 4px rgba(100,116,139,.3)}
/* 纵向时间线 */
.vertical-timeline{position:relative;padding-left:24px}
.vertical-timeline::before{content:'';position:absolute;left:7px;top:8px;bottom:8px;width:2px;background:var(--border)}
.vt-item{position:relative;padding-bottom:20px}
.vt-item:last-child{padding-bottom:0}
.vt-dot{position:absolute;left:-24px;top:4px;width:16px;height:16px;border-radius:50%;background:var(--accent);border:3px solid var(--bg);z-index:1;box-shadow:0 0 0 2px var(--accent)}
.vt-date{font-size:12px;font-weight:700;color:var(--accent-light);margin-bottom:2px}
.vt-event{font-size:14px;font-weight:600;color:var(--text);margin-bottom:2px}
.vt-note{font-size:12px;color:var(--text-secondary);line-height:1.5}
/* 客户详情大标题 */
.account-hero{background:var(--gradient-hero);border-radius:var(--radius-xl);padding:28px 32px;margin-bottom:20px;position:relative;overflow:hidden;border:1px solid rgba(59,130,246,.1)}
.account-hero::before{content:'';position:absolute;top:-30%;right:-10%;width:300px;height:300px;background:radial-gradient(circle,rgba(59,130,246,.08) 0%,transparent 70%);pointer-events:none}
.account-hero-top{display:flex;align-items:center;gap:16px;position:relative}
.account-hero-top .tier-badge{width:48px;height:48px;font-size:20px;border-radius:10px}
.account-hero-name{font-size:24px;font-weight:800;color:var(--text-bright);position:relative}
.account-hero-tags{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap;position:relative}
.account-hero-amount{margin-left:auto;text-align:right;position:relative}
.account-hero-amount .amount-label{font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.5px}
.info-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.info-grid .detail-field{margin-bottom:0}

/* ===== 活动卡片列表 ===== */
.event-list-cards{display:flex;flex-direction:column;gap:10px}
.event-card{background:#2A2A3E;border:1px solid rgba(255,255,255,.06);border-radius:var(--radius-lg);padding:16px 20px;cursor:pointer;display:flex;align-items:center;gap:16px;transition:all .2s}
.event-card:hover{background:#33334d;border-color:var(--accent);box-shadow:var(--shadow-glow);transform:translateY(-1px)}
.event-card-left{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.event-card-left .ec-top{display:flex;align-items:center;gap:10px}
.event-card-left .ec-name{font-size:15px;font-weight:700;color:var(--text-bright);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.event-card-left .ec-theme{font-size:12px;color:var(--text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.event-card-right{display:flex;align-items:center;gap:12px;flex-shrink:0}
.event-card .ec-meta{display:flex;flex-direction:column;gap:3px;margin-right:4px}
.event-card .ec-meta-item{font-size:11px;color:var(--text-muted);white-space:nowrap}
.event-card .ec-metrics{display:flex;gap:6px}
.metric-pill{background:rgba(255,255,255,.06);border-radius:8px;padding:6px 10px;text-align:center;min-width:52px}
.metric-pill .mp-value{font-size:15px;font-weight:700;color:#fff;line-height:1.2}
.metric-pill .mp-label{font-size:9px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.5px;margin-top:2px}
.event-card .ec-status{margin-left:4px;flex-shrink:0}
.event-card .ec-edit-btn{opacity:0;transition:opacity .15s}
.event-card:hover .ec-edit-btn{opacity:1}
.ec-type-tag{display:inline-flex;padding:4px 12px;border-radius:20px;font-size:11px;font-weight:600;white-space:nowrap;letter-spacing:.3px}
.ec-type-论坛{background:rgba(139,92,246,.2);color:#a78bfa}
.ec-type-展会{background:rgba(168,85,247,.2);color:#c084fc}
.ec-type-参访{background:rgba(16,185,129,.15);color:#34d399}
.ec-type-峰会{background:rgba(236,72,153,.15);color:#f472b6}
.ec-type-沙龙{background:rgba(6,182,212,.15);color:#22d3ee}
.ec-type-发布会{background:rgba(59,130,246,.15);color:#60a5fa}
.ec-type-default{background:rgba(100,116,139,.15);color:#94a3b8}

/* ===== Pipeline Kanban 看板 ===== */
.kanban-board{display:flex;gap:12px;overflow-x:auto;padding:4px 0 16px;align-items:flex-start}
.kanban-column{width:270px;flex-shrink:0;background:var(--bg-surface);border-radius:var(--radius-lg);display:flex;flex-direction:column;max-height:calc(100vh - 200px);border:1px solid var(--border);transition:border-color .3s,box-shadow .3s}
.kanban-column.col-highlighted{border-color:var(--accent);box-shadow:0 0 16px rgba(59,130,246,.25)}
.kanban-column-header{padding:12px 14px 10px;border-top:3px solid var(--accent);border-radius:var(--radius-lg) var(--radius-lg) 0 0;display:flex;align-items:center;gap:8px;position:sticky;top:0;background:var(--bg-surface);z-index:1}
.kanban-column-header .kch-name{font-size:13px;font-weight:700;color:var(--text);flex:1}
.kanban-column-header .kch-count{background:rgba(255,255,255,.08);color:var(--text-secondary);padding:1px 8px;border-radius:10px;font-size:11px;font-weight:600}
.kanban-cards{padding:8px 10px 12px;overflow-y:auto;flex:1}
.pipeline-card{background:#2a2a3a;border:1px solid rgba(255,255,255,.04);border-radius:var(--radius);padding:12px 14px;margin-bottom:8px;cursor:pointer;transition:all .15s}
.pipeline-card:hover{border-color:var(--border-light);transform:translateY(-1px);box-shadow:var(--shadow-md);background:#353548}
.pipeline-card:last-child{margin-bottom:0}
.pipeline-card .pc-top{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.pipeline-card .pc-tier{width:26px;height:26px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff;flex-shrink:0}
.pipeline-card .pc-tier-S{background:var(--tier-s);box-shadow:0 0 8px rgba(239,68,68,.3)}
.pipeline-card .pc-tier-A{background:var(--tier-a);box-shadow:0 0 8px rgba(249,115,22,.3)}
.pipeline-card .pc-tier-B{background:var(--tier-b);box-shadow:0 0 8px rgba(59,130,246,.3)}
.pipeline-card .pc-tier-C{background:var(--tier-c)}
.pipeline-card .pc-tier-D{background:#475569}
.pipeline-card .pc-name{font-size:14px;font-weight:700;color:var(--text-bright);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.pipeline-card .pc-industry{font-size:11px;color:var(--text-muted);margin-bottom:8px}
.pipeline-card .pc-progress{height:4px;background:rgba(255,255,255,.06);border-radius:2px;margin-bottom:8px;overflow:hidden}
.pipeline-card .pc-progress-fill{height:100%;border-radius:2px;transition:width .4s}
.pipeline-card .pc-desc{font-size:11px;color:var(--text-secondary);line-height:1.5;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;margin-bottom:6px}
.pipeline-card .pc-amount{font-size:12px;font-weight:700;color:var(--accent-light);margin-bottom:4px}
.pipeline-card .pc-owner{font-size:10px;color:var(--text-muted)}

/* Stage distribution clickable link */
.stage-dist-link{display:flex;align-items:center;gap:6px;cursor:pointer;color:var(--text);font-size:13px;font-weight:600;transition:color .15s}
.stage-dist-link:hover{color:var(--accent-light)}
.stage-dist-link .sdl-arrow{font-size:11px;color:var(--text-muted);transition:transform .15s}
.stage-dist-link:hover .sdl-arrow{color:var(--accent-light);transform:translateX(2px)}

/* Contact org chart grouping */
.contact-group{margin-bottom:16px}
.contact-group-header{padding:8px 12px;font-weight:600;font-size:13px;border-radius:6px 6px 0 0;display:flex;align-items:center;gap:8px}
.contact-group-header.cg-decision{background:rgba(239,68,68,.1);border-left:3px solid var(--danger);color:#f87171}
.contact-group-header.cg-management{background:rgba(245,158,11,.1);border-left:3px solid var(--warning);color:#fbbf24}
.contact-group-header.cg-execution{background:rgba(59,130,246,.1);border-left:3px solid var(--accent);color:#60a5fa}
.contact-group-body{background:var(--bg-card);border:1px solid var(--border);border-top:none;border-radius:0 0 6px 6px;padding:8px}
.contact-person-card{padding:10px 12px;border-bottom:1px solid rgba(51,65,85,.3);display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap}
.contact-person-card:last-child{border-bottom:none}
.cpc-name{font-weight:600;font-size:14px;display:flex;align-items:center;gap:6px}
.cpc-champion{color:#fbbf24;font-size:12px}
.cpc-title{font-size:12px;color:var(--text-secondary)}
.cpc-contact{font-size:11px;color:var(--text-muted);margin-left:auto}
.cpc-notes{width:100%;font-size:11px;color:var(--text-muted);margin-top:4px}
.cpc-actions{display:flex;gap:4px}
</style>
</head>
<body>
<div class="layout">
  <aside class="sidebar">
    <div class="sidebar-logo">
      <h1>🏢 MKT-CRM</h1>
      <small>市场部 AI-Native 工作台</small>
    </div>
    <nav class="sidebar-nav">
      <div class="nav-section">
        <div class="nav-section-title">概览</div>
        <div class="nav-item active" data-page="dashboard" onclick="navigate('dashboard')">
          <span class="icon">📊</span>Dashboard
        </div>
      </div>
      <div class="nav-section">
        <div class="nav-section-title">业务板块</div>
        <div class="nav-item" data-page="ceo-events" onclick="navigate('ceo-events')">
          <span class="icon">🎤</span>活动和CEO获客<span class="badge" id="badge-speeches">0</span>
        </div>
        <div class="nav-item" data-page="octo-summary" onclick="navigate('octo-summary')">
          <span class="icon">🐙</span>Octo 大客户复盘<span class="badge" id="badge-blockers" style="display:none">0</span>
        </div>
        <div class="nav-item" data-page="funnel" onclick="navigate('funnel')">
          <span class="icon">🔄</span>SDR 漏斗<span class="badge" id="badge-leads">0</span>
        </div>
      </div>
      <div class="nav-section">
        <div class="nav-section-title">数据管理</div>
        <div class="nav-item" data-page="import" onclick="navigate('import')">
          <span class="icon">📥</span>数据导入
        </div>
      </div>
    </nav>
    <div style="padding:16px;border-top:1px solid rgba(255,255,255,.06);font-size:10px;color:var(--text-muted)">
      MKT-CRM v2.0 · 明略科技市场部
    </div>
  </aside>

  <div class="main">
    <div class="header">
      <h2 id="page-title">Dashboard</h2>
      <div class="header-actions" id="header-actions"></div>
    </div>
    <div class="content" id="content"></div>
  </div>
</div>

<div class="modal-overlay" id="modal-overlay" onclick="if(event.target===this)closeModal()">
  <div class="modal" id="modal"></div>
</div>
<div class="toast-container" id="toast-container"></div>

<script>
const API='';
async function api(path,opts={}){const url=API+path;const config={headers:{'Content-Type':'application/json'},...opts};if(config.body&&typeof config.body==='object'&&!(config.body instanceof FormData))config.body=JSON.stringify(config.body);if(config.body instanceof FormData)delete config.headers['Content-Type'];const res=await fetch(url,config);const data=await res.json();if(!res.ok)throw new Error(data.error||'请求失败');return data}
function toast(msg,type='success'){const el=document.createElement('div');el.className=`toast toast-${type}`;el.textContent=msg;document.getElementById('toast-container').appendChild(el);setTimeout(()=>el.remove(),3000)}
function esc(s){if(!s)return '';const d=document.createElement('div');d.textContent=String(s);return d.innerHTML}
function err(e){return `<div class="empty-state"><div class="icon">⚠️</div><p>${esc(e.message||e)}</p></div>`}

let currentPage='dashboard',stats={},charts={};

function navigate(page,params={}){
  currentPage=page;
  document.querySelectorAll('.nav-item').forEach(el=>el.classList.toggle('active',el.dataset.page===page));
  const content=document.getElementById('content');
  const ha=document.getElementById('header-actions');
  ha.innerHTML='';destroyCharts();
  const titles={dashboard:'Dashboard','ceo-events':'🎤 活动和CEO获客','event-detail':'🎪 活动详情','event-form':'🎪 新建/编辑活动','ceo-event-detail':'🎤 演讲详情','ceo-event-form':'🎤 新建/编辑演讲','octo-summary':'🐙 Octo 大客户复盘','octo-pipeline':'🐙 Account Pipeline','account-report':'🐙 客户全景档案',accounts:'🏢 客户列表','account-detail':'🐙 客户 360° 视图','account-form':'🐙 新建/编辑客户',funnel:'🔄 SDR 漏斗',import:'📥 数据导入',pipeline:'📋 Account Pipeline'};
  document.getElementById('page-title').textContent=titles[page]||page;
  const r={dashboard:renderDashboard,'ceo-events':renderCeoEvents,'event-detail':()=>renderEventDetail(params.id),'event-form':()=>renderEventForm(params.id),'ceo-event-detail':()=>renderCeoEventDetail(params.id),'ceo-event-form':()=>renderCeoEventForm(params.id),'octo-summary':()=>renderOctoSummary(params.tab),'octo-pipeline':()=>renderOctoPipeline(params.stage),'account-report':()=>renderAccountReport(params.id),accounts:renderAccounts,'account-detail':()=>renderAccountDetail(params.id),'account-form':()=>renderAccountForm(params.id),funnel:renderFunnel,import:renderImport,pipeline:()=>renderOctoPipeline(params.stage)};
  (r[page]||renderDashboard)();
}
function destroyCharts(){Object.values(charts).forEach(c=>c.destroy());charts={}}

// ===== DASHBOARD =====
async function renderDashboard(){
  const content=document.getElementById('content');
  content.innerHTML='<div style="text-align:center;padding:60px;color:var(--text-muted)">⏳ 加载数据...</div>';
  try{stats=await api('/api/stats')}catch(e){content.innerHTML=err(e);return}
  updateBadges();

  content.innerHTML=`
    <div class="hero">
      <div class="hero-title">MKT-CRM · 市场部数据指挥中心</div>
      <div class="hero-sub">明略科技 · 品牌与市场部 AI-Native 工作台 · 实时数据概览</div>
      <div class="hero-stats">
        <div class="hero-stat animate-in" onclick="navigate('ceo-events')" style="animation-delay:.1s">
          <span class="icon">🎤</span>
          <div class="value pink">${stats.speeches.total}</div>
          <div class="label">活动和CEO获客</div>
          <div class="sub">累计触达 ${fmtNum(stats.speeches.totalAudience)} 人</div>
        </div>
        <div class="hero-stat animate-in" onclick="navigate('octo-summary')" style="animation-delay:.2s">
          <span class="icon">🐙</span>
          <div class="value green">${stats.accounts.total}</div>
          <div class="label">Octo 大客户</div>
          <div class="sub">${stats.accounts.byTier.map(t=>t.tier+': '+t.c).join(' · ')||'等待导入'}</div>
        </div>
        <div class="hero-stat animate-in" onclick="navigate('funnel')" style="animation-delay:.3s">
          <span class="icon">🔄</span>
          <div class="value orange">${stats.leads.total}</div>
          <div class="label">SDR 线索</div>
          <div class="sub">${(stats.leads.byStatus||[]).map(s=>stageName(s.status)+' '+s.c).join(' · ')||'等待导入'}</div>
        </div>
      </div>
    </div>

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:20px">
      <div class="card">
        <div class="card-header"><h3>📊 SDR 线索漏斗</h3></div>
        <div class="card-body">${(stats.leads.byStatus||[]).length?'<div class="chart-container"><canvas id="chart-funnel"></canvas></div>':'<div class="empty-state" style="padding:24px"><p>导入线索数据后自动生成漏斗</p></div>'}</div>
      </div>
      <div class="card">
        <div class="card-header"><h3>🏢 客户等级分布</h3></div>
        <div class="card-body">${stats.accounts.byTier.length?'<div class="chart-container"><canvas id="chart-tiers"></canvas></div>':'<div class="empty-state" style="padding:24px"><p>导入客户数据后自动生成分布图</p></div>'}</div>
      </div>
    </div>

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px">
      <div class="card">
        <div class="card-header"><h3>🎤 活动和CEO获客</h3><button class="btn btn-sm btn-primary" onclick="navigate('ceo-event-form')">+ 新建</button></div>
        <div class="card-body">
          <div style="text-align:center;padding:16px">
            <div style="font-size:36px;font-weight:800;background:var(--gradient-pink);-webkit-background-clip:text;-webkit-text-fill-color:transparent">${stats.speeches.total}</div>
            <div style="font-size:12px;color:var(--text-secondary);margin-top:4px">累计场次 · 触达 ${fmtNum(stats.speeches.totalAudience)} 人</div>
            <button class="btn btn-secondary" style="margin-top:16px" onclick="navigate('ceo-events')">查看全部 →</button>
          </div>
        </div>
      </div>
      <div class="card">
        <div class="card-header"><h3>🔥 最新线索</h3></div>
        <div class="card-body" style="padding:0">
          ${stats.recentLeads.length?`<table>
            <tr><th>姓名</th><th>公司</th><th>来源</th><th>阶段</th></tr>
            ${stats.recentLeads.map(l=>`<tr>
              <td>${esc(l.contact_name)||'—'}</td><td>${esc(l.company_name)||'—'}</td>
              <td>${sourceTag(l.source_channel)}</td><td>${leadStatusTag(l.status)}</td>
            </tr>`).join('')}
          </table>`:'<div class="empty-state" style="padding:32px"><div class="icon">🔄</div><p>暂无线索</p><button class="btn btn-primary" onclick="navigate(\'import\')">📥 导入数据</button></div>'}
        </div>
      </div>
    </div>
  `;

  if(stats.leads.byStatus&&stats.leads.byStatus.length){
    const so=['new','contacted','qualified','opportunity','closed_won','closed_lost'];
    const sd=so.map(s=>(stats.leads.byStatus.find(x=>x.status===s)||{c:0}).c);
    charts.funnel=new Chart(document.getElementById('chart-funnel'),{type:'bar',data:{labels:so.map(leadStatusName),datasets:[{label:'线索数',data:sd,backgroundColor:['#475569','#3b82f6','#8b5cf6','#f59e0b','#10b981','#ef4444'],borderRadius:6,borderSkipped:false}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{y:{beginAtZero:true,ticks:{precision:0,color:'#64748b'},grid:{color:'rgba(51,65,85,.3)'}},x:{ticks:{color:'#64748b'},grid:{display:false}}}}});
  }
  if(stats.accounts.byTier.length){
    charts.tiers=new Chart(document.getElementById('chart-tiers'),{type:'doughnut',data:{labels:stats.accounts.byTier.map(t=>t.tier+' 级'),datasets:[{data:stats.accounts.byTier.map(t=>t.c),backgroundColor:stats.accounts.byTier.map(t=>({'S':'#ef4444','A':'#f97316','B':'#3b82f6','C':'#64748b'}[t.tier])),borderWidth:0,hoverOffset:8}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom',labels:{color:'#94a3b8',padding:16}}}}});
  }
}
function updateBadges(){
  document.getElementById('badge-speeches').textContent=stats.speeches?.total??0;
  document.getElementById('badge-leads').textContent=stats.leads?.total??0;
  // Load octo badges async
  api('/api/octo/summary').then(d=>{
    const blockerCount=(d.kpi?.blockers||0)+(d.kpi?.pendingDecisions||0);
    const bb=document.getElementById('badge-blockers');
    if(blockerCount>0){bb.style.display='';bb.textContent=blockerCount}else{bb.style.display='none'}
  }).catch(()=>{})
}

// ===== EVENTS =====
async function renderEvents(){
  const content=document.getElementById('content');
  const ha=document.getElementById('header-actions');
  ha.innerHTML='<button class="btn btn-primary" style="background:linear-gradient(135deg,#06b6d4,#3b82f6);box-shadow:0 2px 8px rgba(6,182,212,.3)" onclick="navigate(\'event-form\')">+ New Event</button>';
  let data;try{data=await api('/api/events')}catch(e){content.innerHTML=err(e);return}
  content.innerHTML=`
    <div class="search-bar">
      <input type="text" placeholder="搜索活动名称/主题/地点..." id="ev-search" oninput="searchEvents()">
      <select id="ev-status" onchange="searchEvents()"><option value="">全部状态</option><option value="筹备中">筹备中</option><option value="进行中">进行中</option><option value="已结束">已结束</option><option value="已取消">已取消</option></select>
    </div>
    <div class="event-list-cards" id="ev-cards">${data.data.length?data.data.map(evCard).join(''):'<div class="empty-state"><div class="icon">🎪</div><p>暂无活动</p></div>'}</div>`;
}
function evCard(e){
  const typeCls=['论坛','展会','参访','峰会','沙龙','发布会'].includes(e.event_type)?e.event_type:'default';
  return `<div class="event-card" onclick="navigate('event-detail',{id:${e.id}})">
    <div class="event-card-left">
      <div class="ec-top">
        <span class="ec-type-tag ec-type-${typeCls}">${e.event_type||'—'}</span>
        <span class="ec-name">${esc(e.name)}</span>
      </div>
      ${e.theme?`<div class="ec-theme">${esc(e.theme)}</div>`:''}
    </div>
    <div class="event-card-right">
      <div class="ec-meta">
        <div class="ec-meta-item">📅 ${e.date||'—'}</div>
        <div class="ec-meta-item">📍 ${esc(e.location)||'—'}</div>
      </div>
      <div class="ec-metrics">
        <div class="metric-pill"><div class="mp-value">${fmtNum(e.registration_count)}</div><div class="mp-label">REG</div></div>
        <div class="metric-pill"><div class="mp-value">${fmtNum(e.attendance_count)}</div><div class="mp-label">ATTEND</div></div>
        <div class="metric-pill"><div class="mp-value" style="color:var(--accent-light)">${e.leads_count||0}</div><div class="mp-label">LEADS</div></div>
        <div class="metric-pill"><div class="mp-value">${e.mql_count||0}</div><div class="mp-label">MQL</div></div>
      </div>
      <div class="ec-status">${statusTag(e.status)}</div>
      <button class="btn btn-sm btn-secondary ec-edit-btn" onclick="event.stopPropagation();navigate('event-form',{id:${e.id}})">编辑</button>
    </div>
  </div>`;
}
async function searchEvents(){
  const q=document.getElementById('ev-search').value,st=document.getElementById('ev-status').value;
  const p=new URLSearchParams();if(q)p.set('search',q);if(st)p.set('status',st);
  try{const d=await api('/api/events?'+p);const c=document.getElementById('ev-cards');if(c)c.innerHTML=d.data.length?d.data.map(evCard).join(''):'<div class="empty-state"><p>无匹配结果</p></div>'}catch(e){toast(e.message,'error')}
}

// ===== EVENT DETAIL (对齐真实复盘报告) =====
async function renderEventDetail(id){
  const content=document.getElementById('content'),ha=document.getElementById('header-actions');
  try{
    const e=await api(`/api/events/${id}`);
    document.getElementById('page-title').textContent=`🎪 ${e.name}`;

    // ===== CEO获客活动专用明细（二级目录）=====
    if(e.key_messages==='吴明辉(CEO)'){
      const rate1=e.wechat_followers>0?((e.activations||0)/e.wechat_followers*100).toFixed(1)+'%':'—';
      const rate2=e.registrations>0?((e.sql_count||0)/e.registrations*100).toFixed(1)+'%':'—';
      ha.innerHTML=`<button class="btn btn-secondary" onclick="navigate('ceo-events')">← 返回看板</button><button class="btn btn-primary" onclick="navigate('event-form',{id:${id}})">编辑</button><button class="btn btn-danger" onclick="if(confirm('确定删除这场CEO获客活动？'))deleteEvent(${id})">删除</button>`;
      const sfunnel=[['活码加微',e.wechat_followers||0,Math.max(e.wechat_followers,e.registrations||0,1)],['OCTO申请',e.registrations||0,Math.max(e.wechat_followers,e.registrations||0,1)],['审核开通',e.activations||0,Math.max(e.wechat_followers,e.registrations||0,1)],['转出销售',e.sql_count||0,Math.max(e.wechat_followers,e.registrations||0,1)]].map(([l,v,max])=>`<div class="funnel-row"><span class="fl-label">${l}</span><div class="fl-bar"><div class="fl-fill" style="width:${Math.max(v/max*100,2)}%"></div></div><span class="fl-val">${v}</span></div>`).join('');
      content.innerHTML=`
        <div class="stats-grid" style="grid-template-columns:repeat(5,1fr);margin-bottom:20px">
          ${[{v:e.wechat_followers>0?fmtNum(e.wechat_followers):'无活码',l:'活码加微',c:'var(--accent)'},{v:e.registrations||0,l:'OCTO申请',c:'var(--info)'},{v:e.activations||0,l:'审核开通',c:'var(--success)'},{v:e.sql_count||0,l:'转出销售',c:'var(--warning)'},{v:rate1,l:'加微→开通',c:'var(--pink)'}].map(s=>`<div class="stat-card"><div class="accent-bar" style="background:${s.c}"></div><div class="stat-value" style="color:${s.c}">${s.v}</div><div class="stat-label">${s.l}</div></div>`).join('')}
        </div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px">
          <div class="card"><div class="card-header"><h3>基本信息</h3></div><div class="card-body"><div class="detail-grid">
            <div><div class="detail-field"><div class="label">活动类型</div><div class="value"><span class="tag tag-blue">${e.event_type||'—'}</span></div></div></div>
            <div><div class="detail-field"><div class="label">活码创建</div><div class="value">${e.date||'—'}</div></div></div>
            <div><div class="detail-field"><div class="label">获客方式</div><div class="value">${e.wechat_followers>0?'企微活码扫码':'群内直接分享OCTO开通邀请链接'}</div></div></div>
            <div><div class="detail-field"><div class="label">主讲</div><div class="value">${esc(e.key_messages)}</div></div></div>
          </div></div></div>
          <div class="card"><div class="card-header"><h3>漏斗</h3></div><div class="card-body">${sfunnel}<div style="margin-top:8px;font-size:12px;color:var(--text-muted)">申请→转出：${rate2}</div></div></div>
        </div>
        <div class="card"><div class="card-header"><h3>📋 获客明细与特点（报告原文）</h3></div><div class="card-body"><div style="white-space:pre-wrap;line-height:1.8">${esc(e.notes)}</div></div></div>`;
      return;
    }

    ha.innerHTML=`<button class="btn btn-secondary" onclick="navigate('ceo-events')">← 返回看板</button><button class="btn btn-primary" onclick="navigate('event-form',{id:${id}})">编辑</button>`;

    const indDist=tryParse(e.industry_distribution);
    const jobDist=tryParse(e.job_level_distribution);
    const deptDist=tryParse(e.dept_distribution);
    const channels=tryParse(e.channel_sources);
    const prodSigs=tryParse(e.product_signals);
    const indSigs=tryParse(e.industry_signals);
    const opps=tryParse(e.key_opportunities);
    const actions=tryParse(e.action_items);
    const attRate=e.registration_count>0?((e.attendance_count||0)/e.registration_count*100).toFixed(1):0;

    content.innerHTML=`
      <!-- 核心数据速览 -->
      <div class="stats-grid" style="grid-template-columns:repeat(6,1fr);margin-bottom:20px">
        ${[
          {v:fmtNum(e.registration_count),l:'报名人数',c:'var(--accent)',bg:'var(--accent-glow)'},
          {v:fmtNum(e.attendance_count),l:'到场人数',c:'var(--success)',bg:'var(--success-bg)'},
          {v:attRate+'%',l:'到场率',c:attRate>50?'var(--success)':'var(--warning)',bg:attRate>50?'var(--success-bg)':'var(--warning-bg)'},
          {v:e.vip_count||0,l:'VIP嘉宾',c:'var(--info)',bg:'var(--info-bg)'},
          {v:e.leads_count||0,l:'留资数',c:'var(--pink)',bg:'rgba(236,72,153,.12)'},
          {v:e.mql_count||0,l:'MQL',c:'var(--orange)',bg:'rgba(249,115,22,.12)'},
        ].map(s=>`<div class="stat-card"><div class="accent-bar" style="background:${s.c}"></div><div class="stat-value" style="color:${s.c}">${s.v}</div><div class="stat-label">${s.l}</div></div>`).join('')}
      </div>

      <!-- Tabs -->
      <div class="tabs" id="ev-tabs">
        <div class="tab active" onclick="switchEvTab(this,'overview')">概览</div>
        <div class="tab" onclick="switchEvTab(this,'analysis')">数据分析</div>
        <div class="tab" onclick="switchEvTab(this,'leads')">线索漏斗</div>
        <div class="tab" onclick="switchEvTab(this,'signals')">信号分析</div>
        <div class="tab" onclick="switchEvTab(this,'feedback')">现场反馈</div>
        <div class="tab" onclick="switchEvTab(this,'review')">复盘总结</div>
      </div>
      <div id="ev-tab-content">
        <!-- Overview tab (default) -->
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px">
          <div class="card"><div class="card-header"><h3>基本信息</h3></div><div class="card-body">
            <div class="detail-grid">
              <div><div class="detail-field"><div class="label">活动类型</div><div class="value"><span class="tag tag-blue">${e.event_type||'—'}</span></div></div></div>
              <div><div class="detail-field"><div class="label">日期</div><div class="value">${e.date||''}${e.end_date&&e.end_date!==e.date?' ~ '+e.end_date:''}</div></div></div>
              <div><div class="detail-field"><div class="label">地点</div><div class="value">${esc(e.location)}</div></div></div>
              <div><div class="detail-field"><div class="label">规模</div><div class="value">${fmtNum(e.scale)} 人</div></div></div>
              <div><div class="detail-field"><div class="label">主办方</div><div class="value">${esc(e.host)}</div></div></div>
              <div><div class="detail-field"><div class="label">目标客户群</div><div class="value">${esc(e.target_audience)}</div></div></div>
            </div>
          </div></div>
          <div class="card"><div class="card-header"><h3>⭐ 业务设计（独有输入项）</h3></div><div class="card-body">

function renderBars(data,color){
  const max=Math.max(...data.map(d=>d.count||d.pct||0),1);
  return `<div class="data-bars">${data.slice(0,12).map(d=>{
    const val=d.count||0;const pct=d.pct||0;const w=Math.max((val||pct)/max*100,2);
    return `<div class="data-bar-row"><div class="data-bar-label">${esc(d.name)}</div><div class="data-bar"><div class="data-bar-fill" style="width:${w}%;background:${color}"></div></div><div class="data-bar-value">${val?val+'人':''}${pct?' '+pct+'%':''}</div></div>`;
  }).join('')}</div>`;
}

async function saveEvent(ev,id){
  ev.preventDefault();const form=new FormData(document.getElementById('ev-form'));const body=Object.fromEntries(form);
  ['scale','registration_count','attendance_count','vip_count','leads_count','mql_count','sql_count'].forEach(f=>body[f]=+body[f]||0);
  try{if(id){await api(`/api/events/${id}`,{method:'PUT',body});toast('活动更新成功')}else{const r=await api('/api/events',{method:'POST',body});id=r.id;toast('活动创建成功')}navigate('event-detail',{id})}catch(e){toast(e.message,'error')}
}
async function deleteEvent(id){
  try{await api(`/api/events/${id}`,{method:'DELETE'});toast('删除成功');navigate('ceo-events')}catch(e){toast(e.message,'error')}
}

function buildFunnelHTML(rows,colors,total){
  if(!rows.length)return'';
  const topCount=rows[0].count||1;
  return `<div style="display:flex;flex-direction:column;gap:8px">
    ${rows.map((s,i)=>{
      const wPct=Math.max((s.count/topCount)*100,8);
      const isFirst=i===0;
      return `<div style="display:flex;align-items:center;gap:12px">
        <div style="min-width:72px;font-size:13px;font-weight:500;color:var(--text-secondary);text-align:right">${esc(s.name)}</div>
        <div style="flex:1;position:relative;height:36px;background:var(--bg-surface);border-radius:6px;overflow:hidden">
          <div style="width:${wPct}%;height:100%;background:linear-gradient(90deg,${colors[s.status]},${colors[s.status]}cc);border-radius:6px;display:flex;align-items:center;justify-content:flex-end;padding-right:12px;transition:width .8s cubic-bezier(.4,0,.2,1);min-width:40px">
            <span style="font-size:16px;font-weight:800;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.4)">${s.count}</span>
          </div>
        </div>
        <div style="min-width:80px;font-size:11px;color:var(--text-muted);text-align:left">
          ${isFirst?`<span style="color:${colors[s.status]}">起点</span>`:`<span style="color:${colors[s.status]};font-weight:600">↘ ${s.stageRate}%</span><br><span style="font-size:10px">总占比 ${s.totalRate}%</span>`}
        </div>
      </div>`;
    }).join('')}
  </div>`;
}

function renderHBars(items,color){
  if(!items||!items.length)return'';
  const max=Math.max(...items.map(i=>i.count),1);
  const palette=[color,'#8b5cf6','#10b981','#f59e0b','#ec4899','#06b6d4','#f97316','#6366f1','#84cc16','#ef4444'];
  return `<div class="data-bars">${items.slice(0,12).map((i,idx)=>{
    const pct=Math.max((i.count/max)*100,3);
    const c=palette[idx%palette.length];
    return `<div class="data-bar-row"><div class="data-bar-label" title="${esc(i.name)}">${esc(i.name)}</div><div class="data-bar"><div class="data-bar-fill" style="width:${pct}%;background:${c}"></div></div><div class="data-bar-value" style="color:${c}">${i.count}</div></div>`;
  }).join('')}</div>`;
}
function renderStageBars(stages){
  if(!stages||!stages.length)return'';
  const max=Math.max(...stages.map(s=>s.count),1);
  const colorMap={'已签约':'#10b981','交付中':'#06b6d4','投标中':'#f59e0b','POC中':'#8b5cf6','B类重点推进':'#3b82f6','重点推进':'#3b82f6','C类跟进':'#64748b','跟进中':'#64748b','D类观察':'#94a3b8','观察':'#94a3b8','战败':'#ef4444','放弃':'#ef4444'};
  return `<div class="data-bars">${stages.map(s=>{
    const pct=Math.max((s.count/max)*100,3);
    const c=colorMap[s.stage]||'#64748b';
    return `<div class="data-bar-row"><div class="data-bar-label" title="${esc(s.stage)}">${esc(s.stage)}</div><div class="data-bar"><div class="data-bar-fill" style="width:${pct}%;background:${c}"></div></div><div class="data-bar-value" style="color:${c}">${s.count}</div></div>`;
  }).join('')}</div>`;
}
function renderClickableStageBars(stages){
  if(!stages||!stages.length)return'';
  const max=Math.max(...stages.map(s=>s.count),1);
  return `<div class="data-bars">${stages.map(s=>{
    const pct=Math.max((s.count/max)*100,3);
    const c=stageColor(s.stage);
    return `<div class="data-bar-row" style="cursor:pointer;padding:3px 0;border-radius:var(--radius);transition:background .15s" onmouseover="this.style.background='rgba(255,255,255,.04)'" onmouseout="this.style.background=''" onclick="navigate('octo-pipeline',{stage:'${s.stage}'})">
      <div class="data-bar-label" title="${esc(s.stage)}">${esc(s.stage)}</div>
      <div class="data-bar"><div class="data-bar-fill" style="width:${pct}%;background:${c}"></div></div>
      <div class="data-bar-value" style="color:${c}">${s.count}</div>
    </div>`;
  }).join('')}</div>`;
}
function renderIndustryBars(industries){
  if(!industries||!industries.length)return'';
  const max=Math.max(...industries.map(s=>s.c),1);
  const indColors=['#10b981','#06b6d4','#3b82f6','#8b5cf6','#ec4899','#f59e0b','#f97316','#14b8a6','#6366f1','#84cc16'];
  return `<div class="data-bars">${industries.slice(0,10).map((s,idx)=>{
    const pct=Math.max((s.c/max)*100,3);
    const c=indColors[idx%indColors.length];
    return `<div class="data-bar-row"><div class="data-bar-label" title="${esc(s.industry)}">${esc(s.industry)}</div><div class="data-bar"><div class="data-bar-fill" style="width:${pct}%;background:${c}"></div></div><div class="data-bar-value" style="color:${c}">${s.c}</div></div>`;
  }).join('')}</div>`;
}

      ${renderPageNums(_leadsPage,totalPages)}
      <button class="btn btn-sm btn-secondary" ${+_leadsPage>=totalPages?'disabled style="opacity:.4;cursor:not-allowed"':''} onclick="_leadsPage=${_leadsPage+1};loadLeadsTable()">下页 →</button>
    </div>`:''}

function renderPageNums(cur,total){
  cur=+cur;total=+total;
  let pages=[];
  const add=p=>{if(p>=1&&p<=total&&!pages.includes(p))pages.push(p)};
  add(1);add(total);
  for(let i=cur-2;i<=cur+2;i++)add(i);
  pages.sort((a,b)=>a-b);
  let html='';let prev=0;
  for(const p of pages){
    if(p-prev>1)html+='<span style="color:var(--text-muted);padding:0 4px">…</span>';
    const active=p===cur;
    html+=`<button class="btn btn-sm ${active?'btn-primary':'btn-secondary'}" onclick="_leadsPage=${p};loadLeadsTable()" style="min-width:30px;padding:4px 8px">${p}</button>`;
    prev=p;
  }
  return html;
}

const PIPELINE_COLS=[
  {title:'重点推进',stages:['B类重点推进','C类跟进','D类观察'],color:'#3b82f6'},
  {title:'POC中',stages:['POC中'],color:'#8b5cf6'},
  {title:'投标中',stages:['投标中'],color:'#f59e0b'},
  {title:'交付中',stages:['交付中'],color:'#06b6d4'},
  {title:'已签约',stages:['已签约'],color:'#10b981'},
  {title:'战败',stages:['战败','放弃'],color:'#ef4444'},
];
async function renderOctoPipeline(highlightStage){
  const content=document.getElementById('content'),ha=document.getElementById('header-actions');
  ha.innerHTML='<button class="btn btn-secondary" onclick=\'navigate("octo-summary")\'>← 返回复盘</button> <button class="btn btn-primary" onclick=\'navigate("account-form")\'>+ Add Account</button>';
  document.getElementById('page-title').textContent='🐙 Account Pipeline · 大客户拓展看板';
  content.innerHTML='<div style="text-align:center;padding:60px;color:var(--text-muted)">⏳ 加载中...</div>';
  let data;try{data=await api('/api/accounts?limit=200')}catch(e){content.innerHTML=err(e);return}
  const allAccounts=data.data||[];

  // Build columns
  let columnsHtml='';
  PIPELINE_COLS.forEach(col=>{
    const items=allAccounts.filter(a=>col.stages.includes(a.customer_stage));
    const isHighlighted=highlightStage&&col.stages.includes(highlightStage);
    columnsHtml+=`<div class="kanban-column ${isHighlighted?'col-highlighted':''}" id="kanban-col-${col.title}">
      <div class="kanban-column-header" style="border-top-color:${col.color}">
        <span class="kch-name">${col.title}</span>
        <span class="kch-count">${items.length}</span>
      </div>
      <div class="kanban-cards">
        ${items.length?items.map(a=>pipelineCardHtml(a,col.color)).join(''):'<div style="font-size:11px;color:var(--text-muted);text-align:center;padding:16px 0">暂无客户</div>'}
      </div>
    </div>`;
  });

  const activeAccounts=allAccounts.filter(a=>a.customer_stage&&!['战败','放弃'].includes(a.customer_stage));
  const signedCount=allAccounts.filter(a=>a.customer_stage==='已签约').length;
  const pipelineAmount=activeAccounts.reduce((s,a)=>s+(a.deal_amount||0),0);

  content.innerHTML=`
    <div style="display:flex;gap:12px;margin-bottom:16px">
      <div class="stat-card" style="flex:1"><div class="stat-value">${allAccounts.length}</div><div class="stat-label">全部客户</div></div>
      <div class="stat-card" style="flex:1"><div class="accent-bar" style="background:#10b981"></div><div class="stat-value" style="color:#10b981">${signedCount}</div><div class="stat-label">已签约</div></div>
      <div class="stat-card" style="flex:1"><div class="accent-bar" style="background:var(--pink)"></div><div class="stat-value" style="color:var(--pink)">${pipelineAmount}万</div><div class="stat-label">管线总额</div></div>
    </div>
    <div class="kanban-board">${columnsHtml}</div>`;

  if(highlightStage){
    const matchedCol=PIPELINE_COLS.find(c=>c.stages.includes(highlightStage));
    if(matchedCol){
      const el=document.getElementById('kanban-col-'+matchedCol.title);
      if(el)setTimeout(()=>el.scrollIntoView({behavior:'smooth',inline:'center',block:'nearest'}),100);
    }
  }
}
function pipelineCardHtml(a,colColor){
  const tierCls='pc-tier-'+(a.tier||'C');
  const progressMap={'B类重点推进':20,'重点推进':20,'C类跟进':15,'跟进中':15,'D类观察':10,'观察':10,'POC中':35,'投标中':55,'交付中':75,'已签约':100,'战败':0,'放弃':0};
  const progress=progressMap[a.customer_stage]!==undefined?progressMap[a.customer_stage]:(40+((a.id*17+7)%51));
  const desc=a.product_solutions_detail||a.needs_summary||a.next_step||'';
  const shortDesc=desc.length>40?desc.slice(0,40)+'...':desc;
  return `<div class="pipeline-card" onclick="navigate('account-report',{id:${a.id}})">
    <div class="pc-top">
      <span class="pc-tier ${tierCls}">${a.tier||'C'}</span>
      <span class="pc-name">${esc(a.company_name)}</span>
    </div>
    ${a.industry?`<div class="pc-industry">${esc(a.industry)}</div>`:'<div class="pc-industry" style="opacity:0">&nbsp;</div>'}
    ${a.deal_amount?`<div class="pc-amount">${a.deal_amount}万</div>`:''}
    <div class="pc-progress"><div class="pc-progress-fill" style="width:${progress}%;background:${colColor}"></div></div>
    ${shortDesc?`<div class="pc-desc">${esc(shortDesc)}</div>`:''}
    ${a.assigned_to?`<div class="pc-owner">👤 ${esc(a.assigned_to)}</div>`:''}
  </div>`;
}
